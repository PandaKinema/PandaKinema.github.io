<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カードモックツクール β | Card Mock Maker</title>
<meta name="description" content="ボードゲーム・カードゲームのカードモックをブラウザ上で作成・印刷できる無料ツール。テンプレート、画像、テキストボックス、PDF保存・再編集に対応。">
<meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1d1d" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="カードモックツクール β | Card Mock Maker">
<meta property="og:description" content="カードゲームのモックをブラウザ上で簡単に作成・印刷できるツール。">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">

<style>
:root{
  color-scheme:light dark;
  --bg:#f3f3f3;
  --ink:#191919;
  --cyan:#24b8f2;
  --line:#666;
  --ui-panel:#ffffff;
  --ui-panel-soft:#f7f7f7;
  --ui-panel-hover:#f1f1f1;
  --ui-border:#d8d8d8;
  --ui-border-strong:#bdbdbd;
  --ui-muted:#686868;
  --ui-control:#ffffff;
  --ui-control-ink:#222222;
  --ui-shadow:rgba(0,0,0,.18);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1d1d1d;
    --ink:#eeeeee;
    --ui-panel:#262626;
    --ui-panel-soft:#303030;
    --ui-panel-hover:#393939;
    --ui-border:#444444;
    --ui-border-strong:#5a5a5a;
    --ui-muted:#aaaaaa;
    --ui-control:#303030;
    --ui-control-ink:#f0f0f0;
    --ui-shadow:rgba(0,0,0,.48);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
  color:var(--ink); background:var(--bg);
}
header{
  min-height:58px;background:var(--ui-panel);border-bottom:1px solid var(--ui-border);
  display:flex;align-items:center;gap:7px;padding:9px 12px;position:sticky;top:0;z-index:20;
  flex-wrap:nowrap;white-space:nowrap;
}
header strong{font-size:15px;margin-right:6px}
header select{width:auto!important}
.pdf-note{
  font-size:10px;color:var(--ui-muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
  max-width:300px;min-width:80px;flex:0 1 300px;
}
button,select,input,textarea{font:inherit}
button{
  border:1px solid var(--ui-border-strong);background:var(--ui-control);color:var(--ui-control-ink);border-radius:7px;padding:7px 11px;cursor:pointer;
}
button:hover{background:var(--ui-panel-hover)}
button.primary{background:#111;color:#fff;border-color:#111}
button:disabled{opacity:.4;cursor:default}
.toolbar-spacer{flex:1}
.size-note{font-size:12px;color:#666}
.warn{color:#b42318;font-weight:600}

.layout{display:grid;grid-template-columns:minmax(700px,1fr) 350px;min-height:calc(100vh - 58px)}
main{padding:0;overflow:hidden}
.workspace{display:grid;grid-template-columns:148px minmax(0,1fr);height:calc(100vh - 58px)}
.page-sidebar{
  background:var(--ui-panel-soft);border-right:1px solid var(--ui-border);padding:10px 8px;
  overflow:auto;display:flex;flex-direction:column;gap:8px;
}
.page-sidebar-head{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.page-sidebar-head span{font-size:10px;color:#777}
.page-actions{display:grid;grid-template-columns:34px 1fr 1fr;gap:4px}
.page-actions button{padding:5px 4px;font-size:10px}
.page-thumbs{display:flex;flex-direction:column;gap:9px;padding-bottom:14px}
.page-thumb{
  position:relative;background:#ddd;border:2px solid transparent;border-radius:5px;
  padding:5px;cursor:pointer;transition:.12s;
}
.page-thumb:hover{background:#d7d7d7}
.page-thumb.active{border-color:var(--cyan);background:#fff}
.page-thumb.dragging{opacity:.45}
.page-drop-zone{height:7px;border-radius:4px;transition:.12s}
.page-drop-zone.drag-over{height:16px;background:var(--cyan)}
.page-thumb-num{font-size:10px;color:#555;margin:0 0 4px 2px;padding-right:24px}


.style-toggle{
  margin:0 0 3px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.style-toggle input{display:none}
.style-toggle span{
  width:28px;height:26px;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid #ccc;border-radius:5px;background:#fff;
  font-size:13px;line-height:1;color:#333;
}
.style-toggle .bold-mark{font-weight:700}
.style-toggle .italic-mark{font-style:italic;font-family:Georgia,serif}
.style-toggle input:checked + span{
  background:#222;color:#fff;border-color:#222;
}
.format-row{
  display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;margin-top:4px;
}
.format-row > label:first-child{
  width:82px;margin:0;
}
.format-row .format-color{
  margin-left:auto;min-width:72px;
}
.tcg-field-block{
  margin-bottom:7px;
}
.tcg-field-block textarea{
  min-height:48px;
}
.tcg-color-row{
  margin-top:7px;
  justify-content:space-between;
}
.tcg-color-row .checkline{
  margin:0 0 4px;
}



.size-icon{
  position:relative;
  width:21px;
  height:26px;
  display:inline-flex;
  align-items:center;
  justify-content:flex-start;
  padding-left:2px;
  color:var(--ui-muted);
  font-size:14px;
  line-height:1;
}
.size-icon::before,.size-icon::after{
  content:"";
  position:absolute;
  right:1px;
  width:0;height:0;
  border-left:3px solid transparent;
  border-right:3px solid transparent;
}
.size-icon::before{
  top:5px;
  border-bottom:4px solid var(--cyan);
}
.size-icon::after{
  bottom:5px;
  border-top:4px solid var(--cyan);
}
.style-toggle .underline-mark{text-decoration:underline;font-family:Arial,sans-serif}
.color-trigger{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
}
.color-trigger-icon{display:block;position:relative}
.color-trigger-text-icon{
  width:22px;height:23px;
  font-size:20px;
  line-height:19px;
  font-family:Arial,sans-serif;
  text-align:center;
  color:var(--ui-control-ink);
}
.color-trigger-text-icon::after{
  content:"";
  position:absolute;
  left:1px;right:1px;bottom:0;
  height:4px;
  border-radius:1px;
  background:var(--trigger-color,#222);
}
.color-trigger-stroke-icon{
  width:21px;height:21px;
  box-sizing:border-box;
  border:3px solid var(--trigger-color,#222);
  background:transparent;
}
.color-trigger-fill-icon{
  width:21px;height:21px;
  box-sizing:border-box;
  border:1px solid var(--ui-border-strong);
  background:var(--trigger-color,#fff);
}
.color-trigger.is-none::after{
  content:"";
  position:absolute;
  left:4px;right:4px;top:50%;
  height:2px;
  background:#e31b23;
  transform:rotate(-45deg);
  transform-origin:center;
  pointer-events:none;
}
.color-trigger.is-none .color-trigger-text-icon::after{background:transparent}
.color-trigger.is-none .color-trigger-stroke-icon{border-color:var(--ui-border-strong)}
.color-trigger.is-none .color-trigger-fill-icon{background:transparent}
.color-none-btn{
  width:100%;
  margin:0 0 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:7px 8px;
}
.none-icon{
  width:18px;height:18px;border:1px solid var(--ui-border-strong);border-radius:2px;
  background:linear-gradient(135deg,transparent 43%,#e31b23 44%,#e31b23 56%,transparent 57%);
}
.option-subtool{margin-top:10px;padding-top:8px;border-top:1px solid var(--ui-border)}
.frame-text{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
  user-select:none;
  touch-action:none;
  z-index:91;
}
.frame-text.editable{cursor:move}
.frame-text .resize-handle{
  position:absolute;width:3mm;height:3mm;right:-1.5mm;bottom:-1.5mm;
  background:var(--cyan);border:.3mm solid #fff;border-radius:.5mm;cursor:nwse-resize;
}
.frame-editor{border:1px solid var(--ui-border);border-radius:7px;padding:7px;margin-bottom:7px;background:var(--ui-panel-soft)}
.frame-editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.frame-color-row{display:flex;gap:8px;align-items:flex-end;margin-top:5px}
.frame-color-row .tool-color{margin-right:4px}


.color-trigger{
  background:var(--ui-control)!important;
  color:var(--ui-control-ink)!important;
  border-color:var(--ui-border-strong)!important;
}
.color-trigger:hover{
  background:var(--ui-control-ink)!important;
  color:var(--ui-control)!important;
}
.color-trigger-text-icon{color:currentColor!important}
.color-trigger-fill-icon{
  background:var(--trigger-color,#fff)!important;
  border-color:var(--ui-border-strong)!important;
}
.color-trigger-stroke-icon{
  background:transparent!important;
  border-color:var(--trigger-color,#222)!important;
}
.color-trigger.is-none .color-trigger-fill-icon{background:transparent!important}
.color-trigger.is-none .color-trigger-stroke-icon{border-color:var(--ui-border-strong)!important}
.stroke-width-control{width:108px}
.stroke-width-icon{
  width:22px;
  height:28px;
  display:inline-block;
  position:relative;
  background:
    linear-gradient(currentColor,currentColor) center 7px / 14px 1px no-repeat,
    linear-gradient(currentColor,currentColor) center 13px / 14px 2px no-repeat,
    linear-gradient(currentColor,currentColor) center 20px / 14px 3px no-repeat;
  color:var(--ui-control-ink);
}
.face-bg-tool{margin-top:6px}
.face-bg-tool .tool-file-line{
  display:flex;
  gap:6px;
  align-items:center;
  margin-top:6px;
}
.face-bg-tool .tool-file-line input[type="file"]{flex:1;min-width:0}
.face-bg-tool .tool-file-line button{flex:0 0 auto}

/* Compact editor-tool grammar */
.tool-block{
  border-top:1px solid var(--ui-border);
  padding:7px 0 6px;
}
.tool-block:first-child{border-top:0;padding-top:1px}
.tool-block-title{
  font-size:10px;
  font-weight:700;
  color:var(--ui-muted);
  margin:0 0 5px;
  letter-spacing:.03em;
}
.tool-strip{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
}
.tool-strip-secondary{margin-top:5px;justify-content:flex-start}
.tool-main-input{
  min-width:0!important;
  flex:1 1 auto;
  height:30px;
  padding:5px 7px!important;
}
.tool-number-wrap{
  height:30px;
  display:flex;
  align-items:center;
  border:1px solid var(--ui-border-strong);
  border-radius:5px;
  background:var(--ui-control);
  overflow:hidden;
  flex:0 0 auto;
}
.tool-symbol{
  width:22px;
  text-align:center;
  color:var(--ui-muted);
  font-size:11px;
}
.tool-number{
  width:48px!important;
  height:28px;
  border:0!important;
  border-left:1px solid var(--ui-border)!important;
  border-radius:0!important;
  background:transparent!important;
  color:var(--ui-control-ink);
  padding:3px 4px!important;
  text-align:center;
}
.tool-symbol-select{width:64px!important;height:30px;padding:4px 6px!important;font-size:16px}
.tool-small-select{width:52px!important;height:30px;padding:4px 5px!important}
.tool-mode-select{width:70px!important;height:30px;padding:4px 5px!important}
.tool-file-line input[type="file"]{font-size:10px;padding:4px 0}
.tool-textarea{min-height:54px!important;padding:6px 7px!important}
.tool-color{
  width:30px;
  height:30px;
  flex:0 0 30px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.tool-color .color-trigger{
  width:30px!important;
  height:30px!important;
  padding:3px!important;
  border-radius:5px!important;
}

.style-toggle{margin:0!important;flex:0 0 auto}
.style-toggle span{
  width:30px!important;
  height:30px!important;
  border-color:var(--ui-border-strong)!important;
  background:var(--ui-control)!important;
  color:var(--ui-control-ink)!important;
}
.style-toggle input:checked + span{
  background:var(--ui-control-ink)!important;
  color:var(--ui-control)!important;
  border-color:var(--ui-control-ink)!important;
}
.icon-toggle .slash-mark{font-size:18px;font-weight:700}
.compact-layout-choice{
  grid-template-columns:64px 64px!important;
  justify-content:start;
}
.compact-layout-choice .layout-choice{
  padding:4px!important;
  justify-content:center;
}
.compact-layout-choice .layout-choice input{display:none}
.compact-layout-choice .layout-choice:has(input:checked){
  border-color:var(--cyan)!important;
  box-shadow:0 0 0 1px var(--cyan) inset;
}

.compact-template-controls{padding-top:6px;padding-bottom:6px}
.compact-template-controls > label{margin-top:5px}
.compact-template-controls .row{gap:6px;margin-bottom:4px}
.compact-template-controls .row > label{margin:0;flex:1}
.style-line{
  display:flex;align-items:flex-end;gap:7px;margin:4px 0 6px;flex-wrap:wrap;
}
.style-line > label:first-child{width:82px;margin:0}
.style-line .checkline{margin:0 0 4px}
.style-line .inline-color{margin-left:auto;min-width:72px}
.inline-color label{margin-bottom:2px}
.inline-color input[type="color"]{height:26px}
.compact-file-row{margin-top:4px!important}
.compact-file-row input[type="file"]{margin-top:3px}
.color-line{justify-content:space-between}
#tcgLayoutControls{margin:5px 0}
#tcgLayoutControls > label{margin-bottom:3px}
#tcgLayoutControls .status{display:none}
.page-actions{display:block}
.page-actions button{width:100%}
.page-thumb-menu-btn{
  position:absolute;right:4px;top:2px;z-index:20;
  width:23px;height:22px;padding:0;border:0;background:transparent;
  font-size:16px;line-height:1;border-radius:4px;
}
.page-thumb-menu-btn:hover{background:rgba(0,0,0,.08)}
.page-thumb-menu{
  position:absolute;right:4px;top:25px;z-index:50;
  min-width:92px;background:#fff;border:1px solid #ccc;border-radius:6px;
  box-shadow:0 5px 16px rgba(0,0,0,.16);padding:4px;
}
.page-thumb-menu button{
  display:block;width:100%;border:0;background:transparent;text-align:left;
  padding:6px 7px;font-size:11px;border-radius:4px;
}
.page-thumb-menu button:hover{background:#f0f0f0}

.thumb-viewport{position:relative;width:100%;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.thumb-paper{position:absolute;left:0;top:0;transform-origin:top left;background:#fff}
.canvas-area{overflow:auto;padding:22px}
.paper-wrap{min-width:max-content}

aside{background:var(--ui-panel);border-left:1px solid var(--ui-border);display:flex;flex-direction:column;padding:12px 14px;overflow:auto}
.paper-wrap{width:100%;display:flex;justify-content:center;align-items:flex-start}
.paper{position:relative;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.12);transform-origin:top center}
.sheet-title{
  position:absolute;z-index:6;font-size:4mm;font-weight:700;line-height:1.2;color:#333;
  max-width:80mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.paper.landscape-paper .sheet-title{left:10mm;top:6mm}
.paper.portrait-paper .sheet-title{left:8mm;top:8mm}

.sheet-grid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;gap:0}
.sheet-grid.portrait-card{
  grid-template-columns:var(--pair-w) var(--pair-w);
  grid-template-rows:var(--pair-h) var(--pair-h);
  width:var(--grid-w);height:var(--grid-h);
}
.sheet-grid.landscape-card{
  grid-template-columns:var(--pair-w) var(--pair-w);
  grid-template-rows:var(--pair-h) var(--pair-h);
  width:var(--grid-w);height:var(--grid-h);
}

.pair{position:relative;display:flex}
.portrait-card .pair{width:var(--pair-w);height:var(--pair-h);flex-direction:row}
.landscape-card .pair{width:var(--pair-w);height:var(--pair-h);flex-direction:column}

.face{position:relative;overflow:hidden;background:#fff;cursor:pointer;border:.22mm solid var(--line);flex:none}
.face{width:var(--face-w);height:var(--face-h)}
.portrait-card .face:first-of-type{border-right:0}
.landscape-card .face:first-of-type{border-bottom:0}
.face.selected{z-index:4}
.face.selected::after{
  content:"";position:absolute;inset:0;border:1.1mm solid var(--cyan);pointer-events:none;z-index:9999;
}
.fold{position:absolute;pointer-events:none;z-index:5}
.portrait-card .fold{left:var(--fold-pos);top:0;bottom:0;width:0;border-left:.35mm dashed #777}
.landscape-card .fold{left:0;right:0;top:var(--fold-pos);height:0;border-top:.35mm dashed #777}

.empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:4mm}
.solid{width:100%;height:100%}
.face img{display:block}
.face-content{position:absolute;inset:0;z-index:1}

.card-template{position:absolute;inset:0;background:transparent;color:#111;z-index:1}
.corner{position:absolute;font-weight:700;font-size:7mm;line-height:1;text-align:center;min-width:10mm}
.corner small{display:block;margin-top:1mm;line-height:1}
.corner .suit-text,.corner .suit-img{display:block;margin:1mm auto 0}
.corner .suit-text.small{font-size:2.8mm}
.corner .suit-text.medium{font-size:4mm}
.corner .suit-text.large{font-size:5.2mm}
.corner .suit-img.small{width:3mm;height:3mm;object-fit:contain}
.corner .suit-img.medium{width:4.5mm;height:4.5mm;object-fit:contain}
.corner .suit-img.large{width:6mm;height:6mm;object-fit:contain}
.tl{left:4mm;top:4mm}.tr{right:4mm;top:4mm}
.bl{left:4mm;bottom:4mm;transform:rotate(180deg)}.br{right:4mm;bottom:4mm;transform:rotate(180deg)}
.center-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:31mm;line-height:1}
.card-text{position:absolute;left:7mm;right:7mm;bottom:12mm;text-align:center;font-size:3.5mm;line-height:1.45;white-space:pre-wrap}

.landscape-card .card-template .corner{font-size:6mm;min-width:9mm}
.landscape-card .card-template .corner small{font-size:3.6mm}
.landscape-card .corner .suit-text.small{font-size:2.5mm}
.landscape-card .corner .suit-text.medium{font-size:3.5mm}
.landscape-card .corner .suit-text.large{font-size:4.6mm}
.landscape-card .corner .suit-img.small{width:2.8mm;height:2.8mm}
.landscape-card .corner .suit-img.medium{width:4mm;height:4mm}
.landscape-card .corner .suit-img.large{width:5.5mm;height:5.5mm}
.landscape-card .card-template .center-num{font-size:25mm}
.landscape-card .card-template .card-text{left:16mm;right:16mm;bottom:7mm;font-size:3.2mm}

/* TCG */
.tcg-card{
  position:absolute;inset:0;padding:4mm;z-index:1;
  color:var(--tcg-text,#222);background:transparent;
}
.tcg-name{
  height:9mm;border:0.4mm solid var(--tcg-border,#222);border-radius:1.2mm;
  background:var(--tcg-panel,#fff);
  display:flex;align-items:center;padding:0 3mm;font-size:4mm;font-weight:700;overflow:hidden;
}
.tcg-image{
  position:absolute;left:4mm;right:4mm;top:16mm;height:42mm;
  border:0.45mm solid var(--tcg-border,#222);border-radius:1.3mm;overflow:hidden;background:var(--tcg-panel,#fff);
  display:flex;align-items:center;justify-content:center;color:#999;font-size:3.4mm;
}
.tcg-image img{width:100%;height:100%;object-fit:cover}
.tcg-desc{
  position:absolute;left:4mm;right:4mm;bottom:4mm;height:22mm;
  border:0.45mm solid var(--tcg-border,#222);border-radius:1.3mm;padding:2.5mm;background:var(--tcg-panel,#fff);
  font-size:3.1mm;line-height:1.4;white-space:pre-wrap;overflow:hidden;
}

/* Horizontal card layout 1: stacked */
.landscape-card .tcg-card.layout1{padding:4mm}
.landscape-card .tcg-card.layout1 .tcg-name{
  height:8mm;font-size:3.7mm;
}
.landscape-card .tcg-card.layout1 .tcg-image{
  left:4mm;right:4mm;top:15mm;height:25mm;bottom:auto;width:auto;
}
.landscape-card .tcg-card.layout1 .tcg-desc{
  left:4mm;right:4mm;top:43mm;bottom:4mm;height:auto;
}

/* Horizontal card layout 2: image left / text right */
.landscape-card .tcg-card.layout2{padding:4mm}
.landscape-card .tcg-card.layout2 .tcg-name{height:8mm;font-size:3.7mm}
.landscape-card .tcg-card.layout2 .tcg-image{
  left:4mm;top:15mm;width:42mm;height:auto;bottom:4mm;right:auto;
}
.landscape-card .tcg-card.layout2 .tcg-desc{
  left:50mm;right:4mm;top:15mm;bottom:4mm;height:auto;
}



/* Generic text boxes */

<script>
(() => {
const MM_TO_PX=3.7795275591;
const PRESET=["#111111","#ffffff","#d94a4a","#e48a2a","#e4c62a","#6bbf59","#2fa67f","#3a8dde","#5967d8","#8b5cc7","#d45aa1","#8a6b4c"];
let recentColors=[];

const makePlain=()=>({type:"plain",bgColor:"#ffffff",bgImage:null,bgBorderColor:"#222222",bgBorderWidth:1,bgBorderNone:true});
const makePlaying=()=>({type:"template",template:"playing",number:"7",suit:"●",suitSize:"medium",suitMode:"text",suitImage:null,
  numberColor:"#d94a4a",text:"",textColor:"#222222",bgColor:"#ffffff",bgImage:null,bgBorderColor:"#222222",bgBorderWidth:1,bgBorderNone:true,
  numberStyle:{size:31,bold:true,italic:false},textStyle:{size:12,bold:false,italic:false}});
const makeImageFace=()=>({type:"image",src:null,bgColor:"#ffffff",bgImage:null});
const makePage=()=>Array.from({length:8},(_,i)=>i%2===0?makePlaying():makePlain());

let pages=[makePage()],currentPage=0,selected=0,sheetTitle="";

const el=id=>document.getElementById(id);
const paper=el("paper"),grid=el("sheetGrid");

const CARD_SIZES={
  poker:{label:"ポーカー",w:63,h:88},
  bridge:{label:"ブリッジ",w:58,h:89},
  business:{label:"名刺",w:55,h:91},
  yugioh:{label:"遊戯王サイズ",w:59,h:86},
  credit:{label:"クレジット",w:54,h:86},
  half:{label:"ハーフ",w:44,h:63}
};
function cardMM(){return CARD_SIZES[el("cardSize")?.value]||CARD_SIZES.poker}
function isLandscapeCard(){ return el("paperOrientation").value==="portrait"; } // A4 portrait => horizontal card
function paperMM(){return el("paperOrientation").value==="landscape"?{w:297,h:210}:{w:210,h:297}}
function blockMM(){
  const c=cardMM();
  return isLandscapeCard()?{w:c.h*2,h:c.w*4}:{w:c.w*4,h:c.h*2};
}
function applyCardGeometry(container){
  const c=cardMM();
  let fw,fh,pw,ph,gw,gh,fold;
  if(isLandscapeCard()){
    fw=c.h; fh=c.w;
    pw=c.h; ph=c.w*2;
    gw=c.h*2; gh=c.w*4;
    fold=c.w;
  }else{
    fw=c.w; fh=c.h;
    pw=c.w*2; ph=c.h;
    gw=c.w*4; gh=c.h*2;
    fold=c.w;
  }
  container.style.setProperty("--face-w",fw+"mm");
  container.style.setProperty("--face-h",fh+"mm");
  container.style.setProperty("--pair-w",pw+"mm");
  container.style.setProperty("--pair-h",ph+"mm");
  container.style.setProperty("--grid-w",gw+"mm");
  container.style.setProperty("--grid-h",gh+"mm");
  container.style.setProperty("--fold-pos",fold+"mm");
}
function currentFaces(){return pages[currentPage]}
function deep(v){return JSON.parse(JSON.stringify(v))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function esc(s){return String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]))}


function ensureTextBoxes(d){ if(!Array.isArray(d.textBoxes)) d.textBoxes=[]; return d.textBoxes; }
function makeTextBox(i=0){return {id:"tb_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),text:"テキスト",style:{size:14,bold:false,italic:false,underline:false,color:"#222222",colorNone:false},box:{x:20,y:18+i*16,w:60,h:14},centerSnap:false}}
function ensureFrameTexts(d){if(!Array.isArray(d.frameTexts))d.frameTexts=[];return d.frameTexts}
function makeFrameText(i=0){return {id:"ft_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),text:"フレームテキスト",style:{size:14,bold:false,italic:false,underline:false,color:"#222222",colorNone:false},borderColor:"#222222",borderNone:false,borderWidth:1,fillColor:"#ffffff",fillNone:false,box:{x:18,y:22+i*14,w:64,h:18},centerSnap:false}}
function renderGenericTextBoxes(faceEl,d,selectable=false,idx=-1){
  const items=ensureTextBoxes(d);
  const gx=document.createElement("div");gx.className="snap-guide-x";faceEl.appendChild(gx);
  const gy=document.createElement("div");gy.className="snap-guide-y";faceEl.appendChild(gy);
  items.forEach((item,n)=>{
    const st=item.style||{size:14,bold:false,italic:false,color:"#222222"},b=item.box||{x:20,y:18+n*16,w:60,h:14};
    const div=document.createElement("div");div.className="generic-textbox"+(selectable?" editable":"");
    div.style.left=b.x+"%";div.style.top=b.y+"%";div.style.width=b.w+"%";div.style.height=b.h+"%";
    div.style.fontSize=st.size+"px";div.style.fontWeight=st.bold?700:400;div.style.fontStyle=st.italic?"italic":"normal";div.style.textDecoration=st.underline?"underline":"none";div.style.color=st.colorNone?"transparent":(st.color||"#222");div.textContent=item.text||"";
    if(selectable){const h=document.createElement("div");h.className="resize-handle";div.appendChild(h);enableGenericTextBox(div,idx,item.id)}
    faceEl.appendChild(div);
  });
  renderFrameTexts(faceEl,d,selectable,idx);
}

function renderFrameTexts(faceEl,d,selectable=false,idx=-1){
  const items=ensureFrameTexts(d);
  items.forEach((item,n)=>{
    const st=item.style||{size:14,bold:false,italic:false,underline:false,color:"#222222",colorNone:false};
    const b=item.box||{x:18,y:22+n*14,w:64,h:18};
    const div=document.createElement("div");
    div.className="frame-text"+(selectable?" editable":"");
    div.style.left=b.x+"%";div.style.top=b.y+"%";div.style.width=b.w+"%";div.style.height=b.h+"%";
    div.style.fontSize=st.size+"px";div.style.fontWeight=st.bold?700:400;div.style.fontStyle=st.italic?"italic":"normal";div.style.textDecoration=st.underline?"underline":"none";
    div.style.color=st.colorNone?"transparent":(st.color||"#222");
    div.style.border=(Number(item.borderWidth)||1)+"px solid "+(item.borderNone?"transparent":(item.borderColor||"#222"));
    div.style.background=item.fillNone?"transparent":(item.fillColor||"#fff");
    div.textContent=item.text||"";
    if(selectable){const h=document.createElement("div");h.className="resize-handle";div.appendChild(h);enableFrameText(div,idx,item.id)}
    faceEl.appendChild(div);
  });
}
function enableFrameText(node,idx,itemId){
  let mode=null,startX=0,startY=0,start=null;const handle=node.querySelector(".resize-handle");
  const down=(e,m)=>{e.preventDefault();e.stopPropagation();mode=m;startX=e.clientX;startY=e.clientY;const item=ensureFrameTexts(currentFaces()[idx]).find(x=>x.id===itemId);if(!item)return;start={...(item.box||{x:18,y:22,w:64,h:18})};window.addEventListener("pointermove",move);window.addEventListener("pointerup",up,{once:true})};
  node.addEventListener("pointerdown",e=>{if(e.target!==handle)down(e,"move")});handle.addEventListener("pointerdown",e=>down(e,"resize"));
  function move(e){if(!mode)return;const face=node.closest(".face"),r=face.getBoundingClientRect();const dx=(e.clientX-startX)/r.width*100,dy=(e.clientY-startY)/r.height*100;const item=ensureFrameTexts(currentFaces()[idx]).find(x=>x.id===itemId);if(!item)return;
    if(mode==="move"){let x=clamp(start.x+dx,0,100-start.w),y=clamp(start.y+dy,0,100-start.h);face.classList.remove("show-snap-x","show-snap-y");if(item.centerSnap){const cx=x+start.w/2,cy=y+start.h/2,th=4.5;if(Math.abs(cx-50)<=th){x=50-start.w/2;face.classList.add("show-snap-x")}if(Math.abs(cy-50)<=th){y=50-start.h/2;face.classList.add("show-snap-y")}}item.box={...start,x,y}}
    else{item.box={...start,w:clamp(start.w+dx,12,100-start.x),h:clamp(start.h+dy,7,100-start.y)}}
    const b=item.box;node.style.left=b.x+"%";node.style.top=b.y+"%";node.style.width=b.w+"%";node.style.height=b.h+"%";
  }
  function up(){const face=node.closest(".face");if(face)face.classList.remove("show-snap-x","show-snap-y");mode=null;window.removeEventListener("pointermove",move)}
}

function enableGenericTextBox(node,idx,itemId){
  let mode=null,startX=0,startY=0,start=null;const handle=node.querySelector(".resize-handle");
  const down=(e,m)=>{e.preventDefault();e.stopPropagation();mode=m;startX=e.clientX;startY=e.clientY;const item=ensureTextBoxes(currentFaces()[idx]).find(x=>x.id===itemId);if(!item)return;start={...(item.box||{x:20,y:20,w:60,h:14})};window.addEventListener("pointermove",move);window.addEventListener("pointerup",up,{once:true})};
  node.addEventListener("pointerdown",e=>{if(e.target!==handle)down(e,"move")});handle.addEventListener("pointerdown",e=>down(e,"resize"));
  function move(e){if(!mode)return;const face=node.closest(".face"),r=face.getBoundingClientRect();const dx=(e.clientX-startX)/r.width*100,dy=(e.clientY-startY)/r.height*100;const item=ensureTextBoxes(currentFaces()[idx]).find(x=>x.id===itemId);if(!item)return;
    if(mode==="move"){let x=clamp(start.x+dx,0,100-start.w),y=clamp(start.y+dy,0,100-start.h);face.classList.remove("show-snap-x","show-snap-y");if(item.centerSnap){const cx=x+start.w/2,cy=y+start.h/2,th=4.5;if(Math.abs(cx-50)<=th){x=50-start.w/2;face.classList.add("show-snap-x")}if(Math.abs(cy-50)<=th){y=50-start.h/2;face.classList.add("show-snap-y")}}item.box={...start,x,y}}
    else{const ratio=start.w/start.h;let nw=start.w+dx,nh=nw/ratio;if(Math.abs(dy)>Math.abs(dx)){nh=start.h+dy;nw=nh*ratio}nw=clamp(nw,12,100-start.x);nh=nw/ratio;if(nh>100-start.y){nh=100-start.y;nw=nh*ratio}if(nh<6){nh=6;nw=nh*ratio}item.box={...start,w:nw,h:nh}}
    const b=item.box;node.style.left=b.x+"%";node.style.top=b.y+"%";node.style.width=b.w+"%";node.style.height=b.h+"%";
  }
  function up(){const face=node.closest(".face");if(face)face.classList.remove("show-snap-x","show-snap-y");mode=null;window.removeEventListener("pointermove",move)}
}

function faceName(i){
  const card=Math.floor(i/2)+1;
  return `カード${currentPage*4+card}（ページ内${card}）・${i%2===0?"表":"裏"}`;
}

function setPaper(){
  const p=paperMM();
  paper.style.width=p.w*MM_TO_PX+"px";
  paper.style.height=p.h*MM_TO_PX+"px";
  paper.className="paper "+(el("paperOrientation").value==="landscape"?"landscape-paper":"portrait-paper");
  grid.className="sheet-grid "+(isLandscapeCard()?"landscape-card":"portrait-card");
  updateFit();
  fitPaper();
  renderSheet();
}
function fitPaper(){
  const p=paperMM(),area=document.querySelector(".canvas-area");
  const mobile=window.matchMedia("(max-width:720px)").matches;
  const pad=mobile?20:44;
  const mainWidth=Math.max(1,area.clientWidth-pad);
  const raw=p.w*MM_TO_PX,scale=Math.min(1,mainWidth/raw);

  if(mobile){
    paper.style.left="50%";
    paper.style.transform=`translateX(-50%) scale(${scale})`;
  }else{
    paper.style.left="";
    paper.style.transform=`scale(${scale})`;
  }

  paper.parentElement.style.height=p.h*MM_TO_PX*scale+"px";
}
function updateFit(){
  const p=paperMM(),b=blockMM(),x=(p.w-b.w)/2,y=(p.h-b.h)/2;
  el("fitStatus").textContent=`A4実寸100%想定：左右${x.toFixed(1)}mm / 上下${y.toFixed(1)}mm余白`;
}


function addRecentColor(c){ refreshOpenColorPopup(); }

function enableCustomBox(node,idx,key){
  let mode=null,startX=0,startY=0,start=null;
  const handle=node.querySelector(".resize-handle");
  const pointerDown=(e,m)=>{
    e.preventDefault();e.stopPropagation();mode=m;startX=e.clientX;startY=e.clientY;
    const d=currentFaces()[idx],b=(d.customBoxes&&d.customBoxes[key])||{x:20,y:20,w:60,h:14};
    start={...b};
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up,{once:true});
  };
  node.addEventListener("pointerdown",e=>{if(e.target===handle)return;pointerDown(e,"move")});
  handle.addEventListener("pointerdown",e=>pointerDown(e,"resize"));
  function move(e){
    if(!mode)return;
    const face=node.closest(".face"),r=face.getBoundingClientRect();
    const dx=(e.clientX-startX)/r.width*100,dy=(e.clientY-startY)/r.height*100;
    const d=currentFaces()[idx];
    d.customBoxes=d.customBoxes||{};
    if(mode==="move"){
      d.customBoxes[key]={...start,x:clamp(start.x+dx,0,100-start.w),y:clamp(start.y+dy,0,100-start.h)};
    }else{
      if(e.shiftKey){
        const ratio=start.w/start.h;
        let nw=clamp(start.w+dx,12,100-start.x);
        let nh=nw/ratio;
        if(nh>100-start.y){nh=100-start.y;nw=nh*ratio}
        if(nh<6){nh=6;nw=nh*ratio}
        d.customBoxes[key]={...start,w:nw,h:nh};
      }else{
        d.customBoxes[key]={...start,w:clamp(start.w+dx,12,100-start.x),h:clamp(start.h+dy,6,100-start.y)};
      }
    }
    const b=d.customBoxes[key];
    node.style.left=b.x+"%";node.style.top=b.y+"%";node.style.width=b.w+"%";node.style.height=b.h+"%";
  }
  function up(){mode=null;window.removeEventListener("pointermove",move)}
}

// ---------- Undo / Redo ----------
let undoStack=[];
let redoStack=[];
let historyLastSnapshot=null;
let historyRestoring=false;
let historyPendingStart=null;
let historyTimer=null;
const HISTORY_LIMIT=80;
const HISTORY_GROUP_MS=900;

function historyState(){
  return JSON.stringify({
    pages,
    sheetTitle,
    paperOrientation:el("paperOrientation").value,
    cardSize:el("cardSize").value
  });
}

function updateHistoryButtons(){
  const u=el("undoBtn"),r=el("redoBtn");
  if(u)u.disabled=!undoStack.length && !historyPendingStart;
  if(r)r.disabled=!redoStack.length;
}

function initHistory(){
  if(historyTimer){clearTimeout(historyTimer);historyTimer=null}
  historyLastSnapshot=historyState();
  historyPendingStart=null;
  undoStack=[];
  redoStack=[];
  updateHistoryButtons();
}

function beginGroupedHistory(){
  if(historyRestoring)return;
  const now=historyState();
  if(historyLastSnapshot===null)historyLastSnapshot=now;

  if(historyPendingStart===null){
    historyPendingStart=historyLastSnapshot;
    redoStack=[];
  }

  historyLastSnapshot=now;

  if(historyTimer)clearTimeout(historyTimer);
  historyTimer=setTimeout(commitGroupedHistory,HISTORY_GROUP_MS);
  updateHistoryButtons();
}

function commitGroupedHistory(){
  if(historyTimer){clearTimeout(historyTimer);historyTimer=null}
  if(historyPendingStart===null)return;

  const now=historyState();
  // Only create a history step when something actually changed.
  if(now!==historyPendingStart){
    undoStack.push(historyPendingStart);
    if(undoStack.length>HISTORY_LIMIT)undoStack.shift();
    redoStack=[];
  }

  historyLastSnapshot=now;
  historyPendingStart=null;
  updateHistoryButtons();
}

function recordHistory(){
  if(historyRestoring)return;
  const now=historyState();
  if(historyLastSnapshot===null){
    historyLastSnapshot=now;
    return;
  }
  if(now===historyLastSnapshot)return;
  beginGroupedHistory();
}

function flushHistoryBeforeNavigation(){
  commitGroupedHistory();
}

function applyHistorySnapshot(snapshot){
  const st=JSON.parse(snapshot);
  historyRestoring=true;

  pages=st.pages;
  sheetTitle=st.sheetTitle||"";
  el("paperOrientation").value=st.paperOrientation||"landscape";
  el("cardSize").value=st.cardSize||"poker";
  el("sheetTitleInput").value=sheetTitle;

  currentPage=Math.min(currentPage,pages.length-1);
  selected=Math.min(selected,7);

  setPaper();
  syncControls();

  historyLastSnapshot=snapshot;
  historyPendingStart=null;
  historyRestoring=false;
  updateHistoryButtons();
}

function undoHistory(){
  flushHistoryBeforeNavigation();
  if(!undoStack.length)return;

  const current=historyState();
  const previous=undoStack.pop();
  redoStack.push(current);
  applyHistorySnapshot(previous);
}

function redoHistory(){
  flushHistoryBeforeNavigation();
  if(!redoStack.length)return;

  const current=historyState();
  const next=redoStack.pop();
  undoStack.push(current);
  applyHistorySnapshot(next);
}

function buildSheet(container,faces,selectable=true){
  container.innerHTML="";
  container.className="sheet-grid "+(isLandscapeCard()?"landscape-card":"portrait-card");
  applyCardGeometry(container);
  for(let c=0;c<4;c++){
    const pair=document.createElement("div");pair.className="pair";
    for(let side=0;side<2;side++){
      const idx=c*2+side,f=document.createElement("div");
      f.className="face"+(selectable&&idx===selected?" selected":"");
      renderFace(f,faces[idx],selectable&&idx===selected,idx);
      if(selectable) f.addEventListener("click",()=>{selected=idx;renderSheet();syncControls()});
      pair.appendChild(f);
    }
    const fold=document.createElement("div");fold.className="fold";pair.appendChild(fold);
    container.appendChild(pair);
  }
}

function renderSheet(){
  recordHistory();
  el("sheetTitle").textContent=sheetTitle;
  buildSheet(grid,currentFaces(),true);
  el("pageCount").textContent=`${currentPage+1} / ${pages.length}`;
  el("addPage").disabled=pages.length>=25;
  el("dupPage").disabled=pages.length>=25;
  el("deletePage").disabled=pages.length<=1;
  renderPageSidebar();
}


function renderPageSidebar(){
  const box=el("pageThumbs");
  if(!box)return;
  box.innerHTML="";
  const p=paperMM();
  const viewportW=116;
  const fullW=p.w*MM_TO_PX, fullH=p.h*MM_TO_PX;
  const scale=viewportW/fullW;
  const viewportH=fullH*scale;

  let dragFrom=null;

  function makeDropZone(insertIndex){
    const zone=document.createElement("div");
    zone.className="page-drop-zone";
    zone.addEventListener("dragover",e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect="move";
      zone.classList.add("drag-over");
    });
    zone.addEventListener("dragleave",()=>zone.classList.remove("drag-over"));
    zone.addEventListener("drop",e=>{
      e.preventDefault();
      zone.classList.remove("drag-over");
      const from=dragFrom ?? Number(e.dataTransfer.getData("text/plain"));
      if(from===null || Number.isNaN(from))return;

      const activePage=pages[currentPage];
      const moved=pages.splice(from,1)[0];
      let target=insertIndex;
      if(from<insertIndex) target--;
      target=Math.max(0,Math.min(target,pages.length));
      pages.splice(target,0,moved);

      currentPage=pages.indexOf(activePage);
      if(currentPage<0) currentPage=target;
      dragFrom=null;
      renderSheet();
      syncControls();
    });
    return zone;
  }

  pages.forEach((pg,i)=>{
    box.appendChild(makeDropZone(i));

    const item=document.createElement("div");
    item.className="page-thumb"+(i===currentPage?" active":"");
    item.draggable=true;
    item.dataset.index=i;
    item.onclick=()=>{
      currentPage=i;selected=0;renderSheet();syncControls();
    };
    item.addEventListener("dragstart",e=>{
      dragFrom=i;
      e.dataTransfer.setData("text/plain",String(i));
      e.dataTransfer.effectAllowed="move";
      item.classList.add("dragging");
    });
    item.addEventListener("dragend",()=>{
      item.classList.remove("dragging");
      document.querySelectorAll(".page-drop-zone.drag-over").forEach(z=>z.classList.remove("drag-over"));
    });

    const n=document.createElement("div");
    n.className="page-thumb-num";
    n.textContent=`${i+1}`;
    item.appendChild(n);

    const menuBtn=document.createElement("button");
    menuBtn.type="button";
    menuBtn.className="page-thumb-menu-btn";
    menuBtn.textContent="…";
    menuBtn.title="ページメニュー";
    menuBtn.addEventListener("click",e=>{
      e.preventDefault();e.stopPropagation();
      document.querySelectorAll(".page-thumb-menu").forEach(m=>m.remove());
      const menu=document.createElement("div");
      menu.className="page-thumb-menu";

      const dup=document.createElement("button");
      dup.type="button";dup.textContent="複製";dup.disabled=pages.length>=25;
      dup.addEventListener("click",ev=>{
        ev.stopPropagation();
        if(pages.length>=25)return;
        pages.splice(i+1,0,deep(pages[i]));
        currentPage=i+1;selected=0;
        renderSheet();syncControls();
      });

      const del=document.createElement("button");
      del.type="button";del.textContent="削除";del.disabled=pages.length<=1;
      del.addEventListener("click",ev=>{
        ev.stopPropagation();
        if(pages.length<=1)return;
        pages.splice(i,1);
        if(currentPage===i) currentPage=Math.min(i,pages.length-1);
        else if(currentPage>i) currentPage--;
        selected=0;
        renderSheet();syncControls();
      });

      menu.appendChild(dup);menu.appendChild(del);
      item.appendChild(menu);
    });
    item.appendChild(menuBtn);

    const vp=document.createElement("div");
    vp.className="thumb-viewport";
    vp.style.height=viewportH+"px";

    const thumb=document.createElement("div");
    thumb.className="thumb-paper "+(el("paperOrientation").value==="landscape"?"landscape-paper":"portrait-paper");
    thumb.style.width=fullW+"px";
    thumb.style.height=fullH+"px";
    thumb.style.transform=`scale(${scale})`;

    const title=document.createElement("div");
    title.className="sheet-title";
    title.textContent=sheetTitle;
    thumb.appendChild(title);

    const sg=document.createElement("div");
    buildSheet(sg,pg,false);
    thumb.appendChild(sg);

    vp.appendChild(thumb);
    item.appendChild(vp);
    box.appendChild(item);
  });

  box.appendChild(makeDropZone(pages.length));
}

function getProject(){
  return {app:"card-mock-maker-prototype",version:48,paperOrientation:el("paperOrientation").value,cardSize:el("cardSize").value,sheetTitle,recentColors,pages};
}

function migrateGenericTextBoxes(project){(project.pages||[]).forEach(pg=>pg.forEach(d=>{if(!d)return;if(!Array.isArray(d.textBoxes))d.textBoxes=[];if(d.template==="custom"&&d.customTexts&&!d.textBoxes.length){["t1","t2","t3","t4","t5"].forEach((k,i)=>{if(d.customTexts[k])d.textBoxes.push({id:"tb_legacy_"+Date.now()+"_"+i,text:d.customTexts[k],style:(d.customStyles&&d.customStyles[k])||{size:i?14:18,bold:false,italic:false,color:"#222222"},box:(d.customBoxes&&d.customBoxes[k])||{x:20,y:18+i*16,w:60,h:14},centerSnap:false})});delete d.customTexts;delete d.customStyles;delete d.customBoxes;delete d.customCount}if(d.template==="word"&&d.sub){if(d.textBoxes.length<5)d.textBoxes.push({id:"tb_word_"+Date.now(),text:d.sub,style:d.subStyle||{size:12,bold:false,italic:false,color:d.subColor||"#222222"},box:d.subBox||{x:20,y:73,w:60,h:14},centerSnap:false});delete d.sub;delete d.subStyle;delete d.subColor;delete d.subBox}}));return project}


function migrateBgBorders(project){
  (project.pages||[]).forEach(pg=>pg.forEach(d=>{
    if(!d)return;
    if(d.bgBorderColor===undefined){
      if(!(d.type==="template" && d.template==="tcg") && d.borderColor!==undefined){
        d.bgBorderColor=d.borderColor||"#222222";
        d.bgBorderWidth=Number(d.borderWidth)>0?Number(d.borderWidth):1.5;
        d.bgBorderNone=d.borderNone===true || !(Number(d.borderWidth)>0);
      }else{
        d.bgBorderColor="#222222";
        d.bgBorderWidth=1.5;
        d.bgBorderNone=true;
      }
    }
  }));
  return project;
}

function restoreProject(p){
  if(!p.pages)throw new Error("invalid project");
  p=migrateGenericTextBoxes(p);
  p=migrateBgBorders(p);
  pages=p.pages.slice(0,25);sheetTitle=p.sheetTitle||"";recentColors=(p.recentColors||[]).slice(0,12);
  el("paperOrientation").value=p.paperOrientation||"landscape";el("cardSize").value=p.cardSize||"poker";el("sheetTitleInput").value=sheetTitle;
  currentPage=0;selected=0;setupAllColorInputs();
document.addEventListener("click",e=>{if(colorPopup&&!e.target.closest(".color-popup")&&!e.target.closest(".color-trigger"))closeColorPopup()});
setPaper();renderSheet();syncControls();
initHistory();
}



function dataUrlToAsset(dataUrl){
  const m=/^data:([^;]+);base64,(.+)$/.exec(dataUrl||"");
  if(!m)return null;
  const mime=m[1],bin=atob(m[2]),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  let ext="bin";
  if(mime==="image/png")ext="png";
  else if(mime==="image/jpeg")ext="jpg";
  else if(mime==="image/webp")ext="webp";
  else if(mime==="image/svg+xml")ext="svg";
  return {mime,bytes,ext};
}

function bytesToDataUrl(bytes,mime){
  let bin="";
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    bin+=String.fromCharCode(...bytes.subarray(i,Math.min(i+chunk,bytes.length)));
  }
  return `data:${mime};base64,${btoa(bin)}`;
}

function externalizeProjectImages(project){
  const clone=deep(project),assets=[],seen=new Map(),keys=new Set(["bgImage","src","suitImage","image"]);
  function walk(obj){
    if(!obj||typeof obj!=="object")return;
    for(const [k,v] of Object.entries(obj)){
      if(keys.has(k) && typeof v==="string" && v.startsWith("data:image/")){
        if(!seen.has(v)){
          const asset=dataUrlToAsset(v);
          if(asset){
            const name=`asset_${String(assets.length+1).padStart(3,"0")}.${asset.ext}`;
            assets.push({name,...asset});
            seen.set(v,name);
          }
        }
        if(seen.has(v)) obj[k]={__pdfAsset:seen.get(v)};
      }else if(v && typeof v==="object"){
        walk(v);
      }
    }
  }
  walk(clone);
  return {project:clone,assets};
}

function hydrateProjectImages(project,attachments){
  const byName=new Map(attachments.map(a=>[a.name,a]));
  function mimeFromName(name){
    const ext=(name.split(".").pop()||"").toLowerCase();
    if(ext==="png")return "image/png";
    if(ext==="jpg"||ext==="jpeg")return "image/jpeg";
    if(ext==="webp")return "image/webp";
    if(ext==="svg")return "image/svg+xml";
    return "application/octet-stream";
  }
  function walk(obj){
    if(!obj||typeof obj!=="object")return;
    for(const [k,v] of Object.entries(obj)){
      if(v && typeof v==="object" && v.__pdfAsset){
        const a=byName.get(v.__pdfAsset);
        if(a)obj[k]=bytesToDataUrl(a.data,mimeFromName(a.name));
      }else if(v && typeof v==="object"){
        walk(v);
      }
    }
  }
  walk(project);
  return project;
}

function showPdfReeditTip(){
  let t=document.querySelector(".pdf-reedit-toast");
  if(!t){t=document.createElement("div");t.className="pdf-reedit-toast";t.textContent="保存したPDFは「PDF読み込み」で再編集できます";document.body.appendChild(t)}
  clearTimeout(showPdfReeditTip.timer);
  requestAnimationFrame(()=>t.classList.add("show"));
  showPdfReeditTip.timer=setTimeout(()=>t.classList.remove("show"),3200);
}
async function buildEditablePdf(){
  if(!window.html2canvas || !window.PDFLib) throw new Error("PDFライブラリを読み込めませんでした。インターネット接続を確認してください。");
  const {PDFDocument}=PDFLib;
  const p=paperMM();
  const ptPerMm=72/25.4;
  const pdf=await PDFDocument.create();

  const staging=document.createElement("div");
  staging.style.position="fixed";staging.style.left="-12000px";staging.style.top="0";
  staging.style.background="#fff";staging.style.zIndex="-1";
  document.body.appendChild(staging);

  try{
    for(const pg of pages){
      const sheet=document.createElement("div");
      sheet.className="print-sheet "+(el("paperOrientation").value==="landscape"?"landscape-paper":"portrait-paper");
      sheet.style.position="relative";
      sheet.style.width=p.w+"mm";sheet.style.height=p.h+"mm";
    sheet.style.minWidth=p.w+"mm";sheet.style.maxWidth=p.w+"mm";
    sheet.style.minHeight=p.h+"mm";sheet.style.maxHeight=p.h+"mm";sheet.style.background="#fff";sheet.style.overflow="hidden";
      const title=document.createElement("div");title.className="sheet-title";title.textContent=sheetTitle;sheet.appendChild(title);
      const sg=document.createElement("div");buildSheet(sg,pg,false);sheet.appendChild(sg);
      staging.appendChild(sheet);

      const canvas=await html2canvas(sheet,{backgroundColor:"#ffffff",scale:2,useCORS:true,logging:false});
      const png=canvas.toDataURL("image/png");
      const img=await pdf.embedPng(png);
      const page=pdf.addPage([p.w*ptPerMm,p.h*ptPerMm]);
      page.drawImage(img,{x:0,y:0,width:p.w*ptPerMm,height:p.h*ptPerMm});
      staging.removeChild(sheet);
    }

    const packed=externalizeProjectImages(getProject());
    const projectBytes=new TextEncoder().encode(JSON.stringify(packed.project));
    await pdf.attach(projectBytes,"card-mock-project.json",{
      mimeType:"application/json",
      description:"Card Mock Maker editable project"
    });
    for(const asset of packed.assets){
      await pdf.attach(asset.bytes,asset.name,{
        mimeType:asset.mime,
        description:"Card Mock Maker image asset"
      });
    }
    pdf.setTitle(sheetTitle||"Card Mock Maker");
    pdf.setSubject("Editable Card Mock Maker PDF");
    pdf.setKeywords(["card-mock-maker","editable-project"]);

    const bytes=await pdf.save();
    const blob=new Blob([bytes],{type:"application/pdf"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=(sheetTitle||"card-mock")+".pdf";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  }finally{
    staging.remove();
  }
}

function extractPdfAttachments(pdfDoc){
  const {PDFName,PDFDict,PDFArray,PDFStream,decodePDFRawStream}=PDFLib;
  if(!pdfDoc.catalog.has(PDFName.of("Names")))return [];
  const names=pdfDoc.catalog.lookup(PDFName.of("Names"),PDFDict);
  if(!names.has(PDFName.of("EmbeddedFiles")))return [];
  let embedded=names.lookup(PDFName.of("EmbeddedFiles"),PDFDict);
  if(!embedded.has(PDFName.of("Names")) && embedded.has(PDFName.of("Kids"))){
    const kids=embedded.lookup(PDFName.of("Kids"),PDFArray);
    if(kids.size()) embedded=kids.lookup(0,PDFDict);
  }
  if(!embedded.has(PDFName.of("Names")))return [];
  const arr=embedded.lookup(PDFName.of("Names"),PDFArray),out=[];
  for(let i=0;i<arr.size();i+=2){
    const fileName=arr.lookup(i);
    const spec=arr.lookup(i+1,PDFDict);
    const stream=spec.lookup(PDFName.of("EF"),PDFDict).lookup(PDFName.of("F"),PDFStream);
    out.push({name:fileName.decodeText(),data:decodePDFRawStream(stream).decode()});
  }
  return out;
}

el("editablePdfBtn").addEventListener("click",async()=>{
  const btn=el("editablePdfBtn"),old=btn.textContent;
  try{
    btn.disabled=true;btn.textContent="PDF作成中…";
    await buildEditablePdf();
    showPdfReeditTip();
  }catch(e){
    console.error(e);alert(e.message||"PDFの保存に失敗しました。");
  }finally{btn.disabled=false;btn.textContent=old}
});

el("loadPdfBtn").addEventListener("click",()=>el("loadPdf").click());
el("loadPdf").addEventListener("change",async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
    if(!window.PDFLib)throw new Error("PDFライブラリを読み込めませんでした。");
    const bytes=await file.arrayBuffer();
    const pdf=await PDFLib.PDFDocument.load(bytes);
    const atts=extractPdfAttachments(pdf);
    const project=atts.find(x=>x.name==="card-mock-project.json");
    if(!project)throw new Error("このPDFにはCard Mock Makerの編集データがありません。");
    const text=new TextDecoder().decode(project.data);
    const parsed=JSON.parse(text);
    restoreProject(hydrateProjectImages(parsed,atts));
  }catch(err){
    console.error(err);alert(err.message||"PDFを読み込めませんでした。");
  }finally{e.target.value=""}
});

function preparePrintPages(){
  const wrap=el("printPages");wrap.innerHTML="";const p=paperMM();
  pages.forEach(pg=>{
    const sheet=document.createElement("div");sheet.className="print-sheet "+(el("paperOrientation").value==="landscape"?"landscape-paper":"portrait-paper");
    sheet.style.width=p.w+"mm";sheet.style.height=p.h+"mm";
    sheet.style.minWidth=p.w+"mm";sheet.style.maxWidth=p.w+"mm";
    sheet.style.minHeight=p.h+"mm";sheet.style.maxHeight=p.h+"mm";
    const title=document.createElement("div");title.className="sheet-title";title.textContent=sheetTitle;sheet.appendChild(title);
    const sg=document.createElement("div");buildSheet(sg,pg,false);sheet.appendChild(sg);wrap.appendChild(sheet);
  });
}

el("printBtn").addEventListener("click",()=>{setExactPrintPage();preparePrintPages();setTimeout(()=>window.print(),80)});



setPaper();renderSheet();syncControls();
initHistory();renderSwatches();
})();
