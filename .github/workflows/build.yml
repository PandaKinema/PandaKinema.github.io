# content/ や画像を保存したら、トップページ(new/index.html)と作品ページ(new/games/*/index.html)を自動で作り直す
name: build
on:
  push:
    branches: [main]
    paths: ['content/**', 'new/img/**', 'new/games/img/**', 'build/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pillow
      - run: python build/build.py
      - run: python build/game_pages.py
      - run: python build/sync_cms.py   # 編集画面の選択肢(カテゴリ・役割・作品)を最新に
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add new/index.html new/colors.html new/games/*/index.html .pages.yml
          if git diff --cached --quiet; then echo "変更なし"; else git commit -m "ページを組み立て直し" && git pull --rebase && git push; fi
