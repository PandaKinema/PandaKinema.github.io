story_ja: 遠い未来、どこかの惑星に、トゥーパという生命体がいました。彼らにとって、塔を建てることは何よりも大事です。高い塔ほど立派ですが、高くしすぎると神の天罰がくだり、たちまち崩れてしまいます。あなたもトゥーパとなり、ときには慎重に、ときには思いきって、誰よりも立派な塔を完成させましょう!
story_en: "In the distant future, creatures called the Túpa lived on a faraway planet. Nothing matters more to them than building towers: the taller, the better—but build too high, and divine punishment will bring it crashing down. Play as a Túpa, balancing caution and courage to build the finest tower of all!"
