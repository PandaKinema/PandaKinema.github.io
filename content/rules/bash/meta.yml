story_ja: やることはただ1つ。手札から1枚出すだけ。相手より大きい数字を出せば得点ゲット!しかし、相手のカードが裏向きだった場合は「パリィ」が発動し、得点を奪われてしまう。さらに、カードの合計が10になると「ラッシュ」突入!ラッシュ中はルールが反転し、小さい数字が勝利する。攻めるか受けるか。この一手を見切り、勝つのはどっちだ!?
story_en: "There’s only one thing to do: play one card from your hand. Play a bigger number than your opponent to score! But if their card is face down, a “Parry” triggers and they steal the points. And when the cards add up to 10, it’s a “Rush”! During a Rush the rule flips and the smaller number wins. Attack or defend? Read this one move. Who will win!?"
