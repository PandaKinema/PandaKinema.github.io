catch_ja: ねむりは競争だ。
catch_en: Sleep is a race.
story_ja: あなたたちは眠りの浅瀬でモコを数えていました。正確に数えるほど、よりよい眠りに近づきます。すると「まぜて!」とパカやポメも現れ、数えるのがだんだんややこしくなっていきます。やがて数が揃うと、不思議なアルファ波「モコチャカ」が生まれ、眠りはより深くなります。しかし、それを阻むのがガブです。ガブの妨害をかいくぐり、最も深い眠りにたどり着くのは誰でしょうか。
story_en: "You were counting Moko in the shallows of sleep. The more accurately you count, the closer you get to a good sleep. Then Paka and Pome show up saying “Let us join!”, and counting gets trickier and trickier. When the numbers line up, a mysterious alpha wave, “Mokochaka,” is born and your sleep grows deeper. But Gabu stands in the way. Who will slip past Gabu and reach the deepest sleep?"
