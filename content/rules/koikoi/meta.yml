story_ja: 花札の『こいこい』をもとにした、鯉のぼりのカードゲーム。同じ色のこいのぼりをペアで取って役を作り、こいのぼりを高く上げましょう。勝負を決めるか、『こいこい』でさらに点を伸ばすか。3局を終えたとき、相手より高くこいのぼりを上げていた方が勝ちです。
story_en: A carp-streamer card game based on the hanafuda game “Koi-Koi.” Take carp streamers of the same color in pairs to make sets, and raise your streamer high. Will you settle the round, or call “Koi-Koi” to push your score even higher? After 3 rounds, whoever has raised their streamer higher than their opponent wins.
