contents_ja: ゲームカード30枚(各色10枚)、リードプレイヤーマーカー1枚、サマリー1枚、トリコマーカー3個、遊び方説明書1枚
contents_en: 30 game cards (10 per color), lead player marker, summary card, 3
  Trico markers, rulebook
steps:
  - text_ja: リードプレイヤーが手札から1枚、カードを表向きに公開します。他の2人のプレイヤーは手札から裏向きで1枚カードを出し、**同時に表向きに公開します。**
    text_en: The lead player reveals one card from their hand face up. The other 2
      players each play a card face down, then **reveal them at the same time.**
  - text_ja: 場に揃った**色の数**で勝敗を決めます。勝ったカードが複数あった場合アピールは無効となり、全て捨て札になります。
    text_en: The **number of colors** on the table decides the winner. If more than
      one card wins, the Appeal is void and all cards are discarded.
  - text_ja: アピールの勝者は場に出た3枚のカードのうち、**好きなカードを1枚獲得**し、手元に表向きで置きます。
    text_en: The winner of the Appeal **takes any one** of the 3 cards played and
      places it face up in front of them.
  - text_ja: 獲得したカードが2色になったら「**ニコ**!」、3色になったら「**トリコ**!」と宣言します。トリコマーカーを2つ獲得したらゲーム終了!
    text_en: Declare **“Nico!”** when your cards hold 2 colors, and **“Trico!”** at
      3 colors. Collect 2 Trico markers to win the game!
