catch_ja: 反射神経で生還せよ
catch_en: Survive on your reflexes
intro_ja: |-
  めくられたカードに正しく反応し、できるだけ多くの得点を集めて生還を目指す**潜水系リアクションゲーム**!  
  謎に包まれた「イカタコ海溝」。小型潜水艇「トリトーン号」で深海へ挑むあなたを待ちうけているのは、**巨大なイカとタコ**!  
  しかし、この潜水艇にはジェスチャーコントロール機能が搭載されています!  
  対応するいずれかの手をあげれば危機を回避することができるのです。  
  様々な困難に対処し、深海からの生還を目指しましょう!
intro_en: React correctly to each card, collect as many points as you can, and
  make it back alive in this **deep-sea reaction game**! In the mysterious
  “Ikatako Trench,” what awaits you in the small submarine “Triton” is a **giant
  squid and octopus**! But this sub has gesture controls! Raise the right hand
  and you can escape danger. Overcome every trouble and make it back from the
  deep!
