catch_ja: あげろ!こいのぼり
catch_en: Raise the carp streamers!
intro_ja: |-
  花札の**『こいこい』**をもとにした、鯉のぼりのカードゲーム。**  
  **同じ色のこいのぼりをペアで取って役を作り、こいのぼりを高く上げましょう。**  
  **勝負を決めるか、**『こいこい』**でさらに点を伸ばすか。  
  3局を終えたとき、相手より高くこいのぼりを上げていた方が勝ちです。
intro_en: A carp-streamer card game based on the hanafuda game **“Koi-Koi.”**
  Take carp streamers of the same color in pairs to make sets, and raise your
  streamer high. Settle the hand, or call **“Koi-Koi”** to push your score even
  higher? After 3 hands, whoever raised their streamer higher wins.
characters:
  - image: img/chara/k_koi.webp
summary_ja: |-
  同じ色のこいのぼりをペアで獲得し、役を作ることを目指します。
  得点を確定させると、トークンを自分の側に引き寄せることができます。
  これを３局行い、終了時にトークンが自分の側にあるプレイヤーの勝利です。
summary_en: |-
  Collect carp streamers of the same color in pairs and aim to make sets.
  When you lock in your points, you can pull the token to your side.
  Play 3 hands; the player with the token on their side at the end wins.
steps:
  - text_ja: 手札から1枚選び、場に出します。続けて山札を上から1枚めくります。どちらも**場に同じ色があれば、ペアで獲得します。**
    text_en: Play 1 card from your hand, then flip the top card of the deck. Either way, **if the table has the same color, take them as a pair.**
  - text_ja: |-
      獲得したカードで役を作ります。

      **1:5枚(1点)**

      **3:4枚(3点)**

      **5:色の異なる3枚(5点)**

      ※5以外は色の数は何色でもOK

      ※役は複数同時に成立することもあります
    text_en: |-
      Make sets with the cards you took.

      **1: five cards (1 pt)**

      **3: four cards (3 pts)**

      **5: three cards of different colors (5 pts)**

      * Except for 5, any colors are OK

      * You can make several sets at once
  - text_ja: 役ができたら**「あがり」**で得点を確定するか、**「こいこい」**で続けて得点アップを狙います。
    text_en: When you make a set, lock in your points with **“Agari”**, or keep going with **“Koi-Koi”** for more.
  - text_ja: 得点に応じてトークンを引き寄せます。**3局終了時、トークンが自分側にあれば勝利です。**
    text_en: Pull the token by your score. **After 3 hands, if the token is on your side, you win.**
