<style>
:root{--bg:#173f53;--paper:#a8872d;--ink:#173f53;--panel:#fffaf0;--line:#b79d59;--muted:#74684d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink)}
.wrap{max-width:720px;margin:auto;padding:16px 12px 48px}
.hero{text-align:center;color:#fff7e5;padding:16px 0 14px}.titleLogo{display:block;width:min(100%,620px);height:auto;margin:0 auto;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.hero p{font-size:13px;opacity:.8;margin:3px 0 0;line-height:1.25}
.card{background:var(--panel);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 28px #0005}
label{font-size:13px;font-weight:800}
textarea{width:100%;min-height:100px;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:18px;resize:vertical}
.previewWrap{margin-top:12px;padding:10px;background:#dfcea0;border-radius:14px;overflow:auto}
canvas{display:block;max-width:100%;height:auto;margin:auto}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:11px 15px;font-weight:800;font-size:14px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink);flex:1}
button.secondary{flex:1}
.status,.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:9px}.makerNote{line-height:1.32}
.shareView{text-align:center}.shareView h2{font-size:18px;margin:2px 0 4px}.shareView .lead{font-size:13px;color:var(--muted);margin:0 0 10px}
.answer{margin-top:13px;padding:13px;background:#f4ead0;border-radius:12px;font-size:18px;font-weight:800;word-break:break-word}
.brand{font-weight:900;letter-spacing:.08em}
.hidden{display:none!important}
.admin{border-top:1px dashed var(--line);margin-top:15px;padding-top:13px}
@media(max-width:520px){.wrap{padding:10px 10px 36px}.card{padding:13px;border-radius:15px}.titleLogo{width:100%}}
.siteCopyright{max-width:760px;margin:-34px auto 0;padding:0 22px 22px;text-align:right;color:rgba(255,255,255,.68);font-size:11px;letter-spacing:.03em}
.siteCopyright .ga-note{display:block;margin-top:3px;font-size:10px;opacity:.8}
.siteCopyright .ga-note a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.sampleStage{position:relative}
.sampleGuide{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:14px auto 2px;
  transform:translateY(6px);
}
.sampleTupa{
  position:relative;
  width:72px;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
  line-height:0;
}
.tupaBase{
  display:block;
  width:100%;
  height:auto;
  clip-path:inset(24% 0 0 0);
  -webkit-clip-path:inset(24% 0 0 0);
}
.tupaRing{
  position:absolute;
  inset:0;
  width:100%;
  height:auto;
  clip-path:inset(0 0 74% 0);
  -webkit-clip-path:inset(0 0 74% 0);
  z-index:3;
  pointer-events:none;
  animation:tupaRingFloat 2.1s ease-in-out infinite;
}
.sampleTupa:active{transform:scale(.94)}
.sampleTupa.tupaBounce{animation:tupaBounce .44s ease}
@keyframes tupaBounce{
  0%,100%{transform:translateY(0)}
  45%{transform:translateY(-9px)}
  70%{transform:translateY(1px)}
}
.sampleTupa.tupaHighJump{animation:tupaHighJump .72s ease}
.sampleTupa.tupaDoubleJump{animation:tupaDoubleJump .92s ease}
.sampleTupa.tupaShake{animation:tupaShake .68s ease}
.sampleTupa.tupaSquish{animation:tupaSquish .68s ease}
.sampleTupa.tupaTilt{animation:tupaTilt 1.05s ease-in-out}
.sampleTupa.haloRush .tupaRing{animation:tupaRingRush .42s ease-in-out 5}
.sampleTupa.tupaAngry{animation:tupaAngry .72s ease}
.sampleTupa.tupaAngry .tupaRing{animation:tupaRingAngry .18s ease-in-out 6}

@keyframes tupaHighJump{
  0%,100%{transform:translateY(0)}
  42%{transform:translateY(-15px)}
  72%{transform:translateY(2px)}
}
@keyframes tupaDoubleJump{
  0%,100%{transform:translateY(0)}
  22%{transform:translateY(-9px)}
  40%{transform:translateY(0)}
  64%{transform:translateY(-12px)}
  82%{transform:translateY(1px)}
}
@keyframes tupaShake{
  0%,100%{transform:translateX(0)}
  18%{transform:translateX(-4px) rotate(-2deg)}
  36%{transform:translateX(4px) rotate(2deg)}
  54%{transform:translateX(-3px) rotate(-1deg)}
  72%{transform:translateX(3px) rotate(1deg)}
}
@keyframes tupaSquish{
  0%,100%{transform:scale(1)}
  28%{transform:scale(.92,1.08)}
  55%{transform:scale(1.06,.92)}
  78%{transform:scale(.98,1.02)}
}
@keyframes tupaTilt{
  0%{transform:rotate(0deg)}
  38%{transform:rotate(-7deg)}
  62%{transform:rotate(-7deg)}
  100%{transform:rotate(0deg)}
}
@keyframes tupaRingRush{
  0%,100%{transform:translateY(-1px)}
  50%{transform:translateY(8px)}
}
@keyframes tupaAngry{
  0%,100%{transform:translateX(0) rotate(0)}
  12%{transform:translateX(-5px) rotate(-4deg)}
  24%{transform:translateX(5px) rotate(4deg)}
  36%{transform:translateX(-5px) rotate(-4deg)}
  48%{transform:translateX(5px) rotate(4deg)}
  60%{transform:translateX(-4px) rotate(-3deg)}
  72%{transform:translateX(4px) rotate(3deg)}
  86%{transform:translateY(-5px)}
}
@keyframes tupaRingAngry{
  0%,100%{transform:translateY(-1px)}
  50%{transform:translateY(9px)}
}
@keyframes tupaRingFloat{
  0%,100%{transform:translateY(-1px)}
  50%{transform:translateY(5px)}
}
@media(max-width:520px){.sampleTupa{width:64px}}
</style>

   const sideMargin=95;
   const usableBaseH=baseH-topH-bottomH;
   // 長文でも文字ブロックの上下に、左右と同程度の余白を必ず確保。
   const requiredAreaH=textH+sideMargin*2;
   const extra=Math.max(0,requiredAreaH-usableBaseH);
   const H=baseH+extra;
   canvas.width=W; canvas.height=H;

   if(templateImg.complete && templateImg.naturalWidth){
     if(extra===0){
       ctx.drawImage(templateImg,0,0,iw,ih,0,0,W,baseH);
     }else{
       const scale=W/iw;
       const topSrc=topH/scale, bottomSrc=bottomH/scale;
       const midSrcY=topSrc;
       const midSrcH=ih-topSrc-bottomSrc;

       // 上下は元画像からそのまま。
       ctx.drawImage(templateImg,0,0,iw,topSrc,0,0,W,topH);

       // 中央も色を生成せず、元画像の中央領域だけを必要な高さに使用。
       // 元画像がベタ背景なので引き伸ばしても色・質感の劣化は発生しない。
       ctx.drawImage(templateImg,0,midSrcY,iw,midSrcH,0,topH,W,H-topH-bottomH);

       ctx.drawImage(templateImg,0,ih-bottomSrc,iw,bottomSrc,0,H-bottomH,W,bottomH);
     }
   }

   const areaY=topH, areaH=H-topH-bottomH;
   const y0=areaY+(areaH-textH)/2;

   ctx.fillStyle="#ffffff";
   lines.forEach((line,li)=>{
     let x=areaX+(areaW-lineWidth(line,u))/2;
     const y=y0+li*lineStep;
     line.forEach(ch=>{
       const g=glyphs[ch];
       if(g){
         for(let r=0;r<GLYPH;r++){
           let c=0;
           while(c<GLYPH){
             if(!g[r*GLYPH+c]){c++;continue}
             const st=c;
             while(c<GLYPH&&g[r*GLYPH+c])c++;
             ctx.fillRect(x+st*u,y+r*u,(c-st)*u,u);
           }
         }
       }else if(ch!==" "&&ch!=="　") missing.add(ch);
       x+=GLYPH*u+GAP*u;
     });
   });
 }else{
   const cell=CELL,pad=2*cell,top=pad,bottom=pad;
   const widest=Math.max(cell,...lines.map(line=>lineWidth(line,cell)));
   const w=Math.max(11*cell,pad*2+widest);
   const h=Math.max(12*cell,top+lines.length*GLYPH*cell+Math.max(0,lines.length-1)*GAP*cell+bottom);
   canvas.width=w;canvas.height=h;
   ctx.clearRect(0,0,w,h);
   ctx.fillStyle="#ffffff";
   lines.forEach((line,li)=>{
     let x=(w-lineWidth(line,cell))/2,y=top+li*(GLYPH+GAP)*cell;
     line.forEach(ch=>{
       const g=glyphs[ch];
       if(g){
         for(let r=0;r<GLYPH;r++)for(let c=0;c<GLYPH;c++)if(g[r*GLYPH+c])ctx.fillRect(x+c*cell,y+r*cell,cell,cell);
       }else if(ch!==" "&&ch!=="　")missing.add(ch);
       x+=GLYPH*cell+GAP*cell;
     });
   });
 }
 return missing;
}

 const tupa=$("#sampleTupa");
 ["tupaBounce","tupaHighJump","tupaDoubleJump","tupaShake","tupaSquish","tupaTilt","haloRush","tupaAngry"]

 // 2秒以内に6回触ると、ちょっと怒る。

// URL用：対応文字を1文字ずつ短い番号にして詰める。
// 旧 #q=Base64 も読めるので、すでに共有したURLはそのまま有効。
const URL_CHARS=Array.from(new Set([
 ..."あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん",
 ..."がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ",
 ..."0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ",
 ..."？！ー 　\n"
]));
function packed(s){
 const bytes=[];
 for(const ch of Array.from(s)){
   const idx=URL_CHARS.indexOf(ch);
   if(idx<0)return null;
   bytes.push(idx);
 }
 let bin="";for(const b of bytes)bin+=String.fromCharCode(b);
 return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unpacked(s){
 try{
   s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
   const bin=atob(s);let out="";
   for(let i=0;i<bin.length;i++){const ch=URL_CHARS[bin.charCodeAt(i)];if(ch===undefined)return"";out+=ch}
   return out;
 }catch{return""}
}
function encoded(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function decoded(s){try{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)))}catch{return""}}
function shareUrl(){
 const u=new URL(location.href);u.search="";
 const raw=$("#text").value;
 const p=packed(raw);
 u.hash=p!==null?"p="+p:"q="+encoded(raw);
 return u.toString()
}

function unionPath(g,x0,y0,u){
 const edges=[];
 const on=(r,c)=>r>=0&&r<7&&c>=0&&c<7&&g[r*7+c];
 const add=(x1,y1,x2,y2)=>edges.push([[x1,y1],[x2,y2]]);
 for(let r=0;r<7;r++)for(let c=0;c<7;c++)if(on(r,c)){
   const x=x0+c*u,y=y0+r*u;
   if(!on(r-1,c))add(x,y,x+u,y);
   if(!on(r,c+1))add(x+u,y,x+u,y+u);
   if(!on(r+1,c))add(x+u,y+u,x,y+u);
   if(!on(r,c-1))add(x,y+u,x,y);
 }
 const key=p=>p[0]+","+p[1], byStart=new Map();
 edges.forEach((e,i)=>{const k=key(e[0]);if(!byStart.has(k))byStart.set(k,[]);byStart.get(k).push(i)});
 const used=new Set();let d="";
 for(let i=0;i<edges.length;i++){
   if(used.has(i))continue;
   let e=edges[i];used.add(i);let cur=e[1];
   d+=`M${e[0][0]} ${e[0][1]}L${cur[0]} ${cur[1]}`;
   while(key(cur)!==key(e[0])){
     const candidates=byStart.get(key(cur))||[];
     const j=candidates.find(v=>!used.has(v));
     if(j===undefined)break;
     used.add(j);cur=edges[j][1];d+=`L${cur[0]} ${cur[1]}`;
   }
   d+="Z";
 }
 return d;
}
function svgFor(text){
 const normalized=normalizeText(text || sampleText);
 const lines=linesFor(normalized),unit=10;
 const widest=Math.max(unit,...lines.map(line=>lineWidth(line,unit)));
 const h=Math.max(unit,lines.length*GLYPH*unit+Math.max(0,lines.length-1)*GAP*unit);
 let body="";
 lines.forEach((line,li)=>{
   let x=(widest-lineWidth(line,unit))/2;
   const y=li*(GLYPH+GAP)*unit;
   line.forEach(ch=>{
     const g=glyphs[ch];
     if(g)body+=`<path d="${unionPath(g,x,y,unit)}" fill="#000" fill-rule="evenodd"/>`;
     x+=charWidth(ch)*unit+GAP*unit;
   });
 });
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${widest} ${h}" width="${widest}" height="${h}">${body}</svg>`;
}
function svgForOneLine(text){
 const normalized=normalizeText(text || sampleText).replace(/\n/g,"");
 const chars=[...normalized];
 const unit=10;
 const w=Math.max(unit,lineWidth(chars,unit));
 const h=GLYPH*unit;
 let body="",x=0;
 chars.forEach(ch=>{
   const g=glyphs[ch];
   if(g)body+=`<path d="${unionPath(g,x,0,unit)}" fill="#000" fill-rule="evenodd"/>`;
   x+=charWidth(ch)*unit+GAP*unit;
 });
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${body}</svg>`;
}

};

function bindSecretTap(el){

}
