<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2228">
<title>ビビル文字ジェネレータ</title>
<meta name="description" content="ことばをビビル文字に変換して遊べます。ボードゲーム「ビビルの塔」の文字で、なぞのメッセージをつくってシェアしよう。">
<meta property="og:title" content="ビビル文字ジェネレータ | PANDA KINEMA">
<meta property="og:type" content="website">
<meta property="og:description" content="ことばをビビル文字に変換して遊べます。">
<meta property="og:url" content="https://pandakinema.github.io/bibilu-moji/">
<meta property="og:image" content="https://pandakinema.github.io/new/img/share/ogp_bibilu-moji.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex"><!-- テスト版のみ。本番に上書きするときはこの行を消す -->
<style>
:root{
 /* 地の色(アイボリー) */
 --paper:#fef4d6;--field:#fffcf2;--ink:#173f53;--ink2:rgba(23,63,83,.74);--ink3:rgba(23,63,83,.42);
 --line:rgba(23,63,83,.2);--tile:rgba(23,63,83,.06);--tile-on:rgba(23,63,83,.2);--red:#c8412c;
 --pri-bg:#173f53;--pri-fg:#fef4d6;--sec-bg:#fffcf2;--sec-fg:#173f53;--sec-bd:#173f53;
 --pat-a:.05;   /* ビビル文字の模様の濃さ */
 --black:#1b2228;   /* 下地(作品ページ・トップと同じ) */
 --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
 --cond:"DIN Condensed","Avenir Next Condensed","Arial Narrow","Helvetica Neue",var(--sans);
 --tw:76px;     /* トゥーパの大きさ */
}
/* 地の色:少し薄めの紺(座布団の中はアイボリー) */
:root{
 --paper:#2c5b73;--field:rgba(9,32,45,.32);--ink:#fef4d6;--ink2:rgba(254,244,214,.78);--ink3:rgba(254,244,214,.45);
 --line:rgba(254,244,214,.26);--tile:rgba(254,244,214,.09);--tile-on:rgba(254,244,214,.26);--red:#ffb4a3;
 --pri-bg:#fef4d6;--pri-fg:#173f53;--sec-bg:transparent;--sec-fg:#fef4d6;--sec-bd:rgba(254,244,214,.7);
 --pat-a:.08;
}
@supports not (text-box:trim-both cap alphabetic){:root{--cond:"Avenir Next Condensed","DIN Condensed","Arial Narrow","Helvetica Neue",var(--sans)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--black);scroll-padding-top:66px}
body{margin:0;background:var(--black);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
a{color:inherit}
.hidden{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* サイト共通のヘッダー(作品ページと同じ形) */
.site-header{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px);background:rgba(27,34,40,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.site-header .bar{display:flex;align-items:center;gap:clamp(14px,2.6vw,34px);min-height:56px;padding-inline:max(16px,3vw)}
.brand{flex:none;display:flex;align-items:center;height:28px}
.brand img{height:30px;width:auto;display:block}
.site-nav{display:flex;gap:clamp(12px,2.2vw,30px);overflow-x:auto;scrollbar-width:none;color:#f3f2ee;font-family:var(--cond);font-size:clamp(14px,1.6vw,19px);font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.site-nav::-webkit-scrollbar{display:none}
.site-nav a{display:flex;align-items:center;height:28px;white-space:nowrap;opacity:.9;text-decoration:none}
.site-nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:5px}
.cap{display:block;line-height:1;text-box:trim-both cap alphabetic}
@media(max-width:650px){.brand img{height:26px}.site-nav{gap:12px;font-size:14px}}

/* 紙(黒い下地の上に載ったレイヤー)。ビビル文字の模様を薄く乗算 */
.paper{position:relative;isolation:isolate;max-width:1280px;margin-inline:auto;background:var(--paper)}
.paper::before{content:"";position:absolute;inset:0;z-index:-1;background:url(/bibilu-moji/img/b_pattern.png) 0 0/525px 175px repeat;opacity:var(--pat-a);mix-blend-mode:multiply;pointer-events:none}

/* タイトル */
.hero{text-align:center;padding:20px 16px 4px}
.titleLogo{display:block;width:min(86%,520px);height:auto;margin:0 auto;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hero p{font-size:12px;letter-spacing:.24em;color:var(--ink2);margin:10px 0 0;font-weight:600}

/* レイアウト */
.layout{max-width:560px;margin:0 auto;padding:14px 16px 0}
.frame{display:flex;justify-content:center}
canvas{display:block;width:auto;height:auto;max-width:100%;border-radius:6px;box-shadow:0 14px 30px rgba(9,20,28,.24),0 2px 6px rgba(9,20,28,.14)}
.panel{margin-top:18px;padding:16px 14px 14px}
.cushion{
 --paper:#fef4d6;--field:#fffcf2;--ink:#173f53;--ink2:rgba(23,63,83,.74);--ink3:rgba(23,63,83,.42);
 --line:rgba(23,63,83,.2);--tile:rgba(23,63,83,.06);--tile-on:rgba(23,63,83,.2);--red:#c8412c;
 --pri-bg:#173f53;--pri-fg:#fef4d6;--sec-bg:#fffcf2;--sec-fg:#173f53;--sec-bd:#173f53;
 background:var(--paper);color:var(--ink);border-radius:18px;box-shadow:0 14px 30px rgba(9,20,28,.2)}

/* 入力欄とトゥーパ(トゥーパは入力欄の右に立つ) */
.inputRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--ink2);margin:0 0 7px 4px}
textarea{display:block;width:100%;height:calc(var(--tw) * 1.02);min-height:56px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:inherit;font-size:18px;line-height:1.5;resize:vertical}
textarea::placeholder{color:var(--ink3)}
textarea:focus{outline:none;border-color:var(--ink3);box-shadow:0 0 0 3px var(--tile)}
.tupaSlot{display:flex;align-items:flex-end;justify-content:center}
.sampleTupa{position:relative;width:var(--tw);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;line-height:0;outline:none;transform-origin:50% 100%}
.sampleTupa:focus-visible{outline:2px solid var(--ink3);outline-offset:6px;border-radius:12px}
.tupaBase{display:block;width:100%;height:auto;clip-path:inset(24% 0 0 0);-webkit-clip-path:inset(24% 0 0 0)}
.tupaRing{position:absolute;inset:0;width:100%;height:auto;clip-path:inset(0 0 74% 0);-webkit-clip-path:inset(0 0 74% 0);z-index:3;pointer-events:none;animation:tupaRingFloat 2.1s ease-in-out infinite}
.sampleTupa:active{transform:scale(.94)}
.sampleTupa.tupaBounce{animation:tupaBounce .44s ease}
.sampleTupa.tupaHighJump{animation:tupaHighJump .72s ease}
.sampleTupa.tupaDoubleJump{animation:tupaDoubleJump .92s ease}
.sampleTupa.tupaShake{animation:tupaShake .68s ease}
.sampleTupa.tupaSquish{animation:tupaSquish .68s ease}
.sampleTupa.tupaTilt{animation:tupaTilt 1.05s ease-in-out}
.sampleTupa.haloRush .tupaRing{animation:tupaRingRush .42s ease-in-out 5}
.sampleTupa.tupaAngry{animation:tupaAngry .72s ease}
.sampleTupa.tupaAngry .tupaRing{animation:tupaRingAngry .18s ease-in-out 6}
@keyframes tupaBounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-9px)}70%{transform:translateY(1px)}}
@keyframes tupaHighJump{0%,100%{transform:translateY(0)}42%{transform:translateY(-15px)}72%{transform:translateY(2px)}}
@keyframes tupaDoubleJump{0%,100%{transform:translateY(0)}22%{transform:translateY(-9px)}40%{transform:translateY(0)}64%{transform:translateY(-12px)}82%{transform:translateY(1px)}}
@keyframes tupaShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-4px) rotate(-2deg)}36%{transform:translateX(4px) rotate(2deg)}54%{transform:translateX(-3px) rotate(-1deg)}72%{transform:translateX(3px) rotate(1deg)}}
@keyframes tupaSquish{0%,100%{transform:scale(1)}28%{transform:scale(.92,1.08)}55%{transform:scale(1.06,.92)}78%{transform:scale(.98,1.02)}}
@keyframes tupaTilt{0%{transform:rotate(0deg)}38%{transform:rotate(-7deg)}62%{transform:rotate(-7deg)}100%{transform:rotate(0deg)}}
@keyframes tupaRingRush{0%,100%{transform:translateY(-1px)}50%{transform:translateY(8px)}}
@keyframes tupaAngry{0%,100%{transform:translateX(0) rotate(0)}12%{transform:translateX(-5px) rotate(-4deg)}24%{transform:translateX(5px) rotate(4deg)}36%{transform:translateX(-5px) rotate(-4deg)}48%{transform:translateX(5px) rotate(4deg)}60%{transform:translateX(-4px) rotate(-3deg)}72%{transform:translateX(4px) rotate(3deg)}86%{transform:translateY(-5px)}}
@keyframes tupaRingAngry{0%,100%{transform:translateY(-1px)}50%{transform:translateY(9px)}}
@keyframes tupaRingFloat{0%,100%{transform:translateY(-1px)}50%{transform:translateY(5px)}}

.note{font-size:12px;color:var(--ink2);line-height:1.65;margin:9px 0 0;text-align:center}
.note span{display:inline-block}
.status{font-size:12px;color:var(--red);font-weight:700;line-height:1.6;margin:6px 0 0;text-align:center}
.status:empty{display:none}

/* ボタン */
.row{display:flex;gap:8px;margin-top:14px}
.btn{appearance:none;flex:1;min-width:0;border-radius:999px;padding:12px 10px;font:inherit;font-weight:800;font-size:14px;letter-spacing:.04em;white-space:nowrap;cursor:pointer;transition:transform .12s ease,filter .15s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pri-bg);color:var(--pri-fg);border:1.5px solid var(--pri-bg)}
.btn.secondary{background:var(--sec-bg);color:var(--sec-fg);border:1.5px solid var(--sec-bd)}
@media(hover:hover){.btn:hover{filter:brightness(1.08)}}
.admin{border-top:1px dashed var(--line);margin-top:16px;padding-top:12px}
.admin .note{margin:0}
.admin .btn{font-size:13px;padding:10px}

/* こたえ */
.answer{margin-top:14px;text-align:center}
.ansText{margin-bottom:10px}
.ansText{font-size:22px;font-weight:800;letter-spacing:.08em;word-break:break-word}
.ansTiles{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px}
.ansLine{display:flex;gap:6px;justify-content:center}
.at{display:flex;flex-direction:column;align-items:center;gap:5px;width:44px}
.at svg{width:34px;height:34px;display:block}
.at i{font-style:normal;font-size:13px;font-weight:700;color:var(--ink3);min-height:1.2em}
.at i.on{color:var(--ink);animation:kanaIn .35s ease both}
@keyframes kanaIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* もじひょう */
.table{margin-top:18px;border-top:1px solid var(--line)}
.table summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 0 2px;font-weight:800;font-size:14px;letter-spacing:.12em}
.table summary::-webkit-details-marker{display:none}
.table summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg) translateY(-3px);transition:transform .2s ease}
.table[open] summary::after{transform:rotate(-135deg) translate(-2px,0)}
.table summary small{font-weight:600;font-size:11px;color:var(--ink2);letter-spacing:.04em}
.tableBody{padding-top:10px}
.sheetHead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.tabs{flex:1;display:flex;gap:4px;padding:3px;background:var(--tile);border-radius:999px}
.tabs button{appearance:none;flex:1;border:0;background:transparent;color:var(--ink2);font:inherit;font-size:12px;font-weight:800;padding:7px 4px;border-radius:999px;cursor:pointer;letter-spacing:.02em;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--pri-bg);color:var(--pri-fg)}
.sheetX{display:none;appearance:none;flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:700 18px/1 var(--sans);cursor:pointer}
.grid{--cw:calc((100% - 30px) / 11);display:grid;gap:3px;justify-content:center;grid-template-columns:repeat(var(--cols),var(--cw))}
.grid.col{grid-auto-flow:column;grid-template-rows:repeat(5,auto)}
.k{appearance:none;border:0;background:var(--tile);color:var(--ink);border-radius:6px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;cursor:pointer;min-width:0}
.k svg{width:min(19px,70%);height:auto;aspect-ratio:1;display:block}
.k i{font-style:normal;font-size:10px;font-weight:700;color:var(--ink2);line-height:1}
.k.blank{visibility:hidden}
.k.flash{background:var(--tile-on)}
.hintGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.hintGrid .k{width:48px;padding:9px 0 6px;gap:5px;cursor:default}
.hintGrid .k svg{width:30px}
.hintGrid .k i{font-size:11px}
@media(min-width:900px){.hintGrid{gap:6px}.hintGrid .k{width:56px;padding:10px 0 7px}.hintGrid .k svg{width:36px}.hintGrid .k i{font-size:12px}}
.is-challenge .k{cursor:default}
.keys{margin-top:10px}
.keys .btn{font-size:13px;padding:9px}

/* 関連コンテンツ(作品ページと同じ形) */
.related{padding:56px 16px 64px;text-align:center}
.secHead{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 0 26px}
.secHead .en{margin:0;padding-left:.34em;font-size:11px;font-weight:800;letter-spacing:.34em;opacity:.72}
.secRow{display:flex;align-items:center;gap:16px}
.secRow::before,.secRow::after{content:"";flex:none;width:26px;height:26px;background:currentColor;-webkit-mask:url(/new/img/page/b_tupa_sten.png) center/contain no-repeat;mask:url(/new/img/page/b_tupa_sten.png) center/contain no-repeat}
.pill{display:inline-block;margin:0;padding:.42em 1.15em .46em;border-radius:999px;font-weight:800;line-height:1.25;letter-spacing:.03em;background:var(--pri-bg);color:var(--pri-fg);font-size:clamp(17px,1.9vw,21px)}
.relRow{list-style:none;margin:0;padding:0;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.relCard{display:flex;flex-direction:column;width:300px;max-width:100%;border-radius:10px;overflow:hidden;background:#fff;color:#1b2228;text-align:left;text-decoration:none;box-shadow:0 14px 26px -16px rgba(0,0,0,.45);transition:translate .2s ease}
.relCard:hover{translate:0 -4px}
.ro-vis{display:flex;align-items:center;justify-content:center;gap:6%;width:100%;aspect-ratio:1.91/1;padding:12px 16px;overflow:hidden}
.ro-pkg{width:auto;height:88%;max-width:42%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.ro-logo{display:block;width:48%;max-height:70%;-webkit-mask:var(--lg) center/contain no-repeat;mask:var(--lg) center/contain no-repeat}
.bl-t{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px}
.bl-t b{font-size:14px;line-height:1.55}
.ro-intro{margin-top:-2px;font-size:12px;font-weight:600;line-height:1.6;opacity:.8}
.bl-t small{font-size:11.5px;font-weight:700;opacity:.55}

/* 下部(黒):作品ページと同じ */
.tail{background:var(--black);color:#f4f4f0;padding-top:28px}
.wrap{width:min(1100px,calc(100% - 40px));margin-inline:auto}
.site-footer{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0 calc(28px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle,rgba(205,210,212,.7) 1.6px,transparent 2px) 0 0/16px 4px repeat-x;font-size:12px;color:#cdd2d4}
.site-footer a{font-family:var(--cond);font-size:14px;letter-spacing:.08em;text-decoration:none}
@media(max-width:650px){.wrap{width:calc(100% - 28px)}.site-footer{flex-direction:column;gap:8px}}

/* トースト */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--pri-bg);color:var(--pri-fg);font-size:13px;font-weight:800;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s ease;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* スマホ:もじひょうは下から出るキーボード(上にプレビューが見える) */
@media(max-width:899px){
 body.kb .tableBody{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(9,20,28,.28);animation:sheetIn .22s ease}
 body.kb .sheetX{display:block}
 body.kb .k{padding:8px 0 5px}
 body.kb .k svg{width:min(21px,72%)}
 @keyframes sheetIn{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
}

/* PC:左にプレビュー、右に操作。もじひょうまでスクロールなしで見える */
@media(min-width:900px){
 :root{--tw:72px}
 .hero{padding:18px 16px 0}
 .titleLogo{width:440px}
 .hero p{margin-top:6px}
 .layout{max-width:1160px;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:40px;align-items:start;padding:18px 32px 0}
 .stage{position:sticky;top:74px}
 canvas{max-height:none}
 .is-challenge .panel{display:flex;flex-direction:column;justify-content:center}
 .panel{margin-top:0;padding:16px 18px}
 body:not(.is-challenge) .table summary{cursor:default;pointer-events:none}
 body:not(.is-challenge) .table summary::after{display:none}
 .table{margin-top:14px}
 .table summary{padding-top:10px}
 .related{padding-top:72px}
}
.panelHead{text-align:center;margin-bottom:2px}
.askRow{display:flex;flex-direction:column;align-items:center;gap:8px}
.askRow .tupaSlot{flex:none}
.askH{margin:0;font-size:clamp(18px,5.2vw,22px);font-weight:800;line-height:1.4;letter-spacing:.03em;text-align:center;white-space:nowrap}
/* お題では文字表(ヒント)は使わない。トゥーパのヒントで十分(戻すならこの行を消す) */
.is-challenge #glyphTable{display:none}
.askNote{font-size:12px;color:var(--ink2);margin:10px 0 0;line-height:1.6}
.askRow{--tw:70px}
@media(min-width:900px){.askRow{--tw:84px}.askH{font-size:24px}}
.askNote span{display:inline-block}
/* PC で幅が狭いとき:座布団を少し細くして、画像と高さがそろう幅を確保 */
@media(min-width:900px) and (max-width:1150px){
 .layout{grid-template-columns:minmax(0,1fr) 370px;gap:28px;padding-inline:24px}
}
/* PC で画面の高さが低いとき:もじひょうまで入るように詰める */
@media(min-width:900px) and (max-height:780px){
 :root{--tw:62px}
 .hero{padding-top:12px}
 .titleLogo{width:380px}
 .hero p{font-size:11px;margin-top:4px}
 .layout{padding-top:12px}
 .lbl{margin-bottom:5px}
 .note{font-size:11px;margin-top:6px;line-height:1.55}
 .row{margin-top:10px}
 .btn{padding:10px}
 .table{margin-top:10px}
 .table summary{padding-top:8px}
 .tableBody{padding-top:8px}
 .sheetHead{margin-bottom:7px}
 .k{padding:5px 0 3px}
 .k svg{width:min(17px,70%)}
 .keys .btn{padding:7px}
}
@media(prefers-reduced-motion:reduce){.tupaRing,.at i{animation:none!important;opacity:1;transform:none}}
</style>
</head>
<body>
<!-- サイトのトップを /new/ から入れ替えたら、このページの「/new/」を外す -->
<header class="site-header">
 <div class="bar">
  <a class="brand" href="/new/"><img src="/new/img/site/logo_icon.png" alt="PANDA KINEMA"></a>
  <nav class="site-nav" aria-label="サイト"><a href="/new/#news"><span class="cap">NEWS</span></a><a href="/new/#board"><span class="cap">BOARD GAME</span></a><a href="/new/#movie"><span class="cap">MOVIE</span></a><a href="/new/#tools"><span class="cap">PLAY&amp;TOOLS</span></a><a href="/new/#about"><span class="cap">ABOUT</span></a></nav>
 </div>
</header>

   if(templateImg.complete && templateImg.naturalWidth){
     if(extra===0){
       ctx.drawImage(templateImg,0,0,iw,ih,0,0,W,baseH);
     }else{
       const scale=W/iw;
       const topSrc=topH/scale, bottomSrc=bottomH/scale;
       const midSrcY=topSrc;
       const midSrcH=ih-topSrc-bottomSrc;
       ctx.drawImage(templateImg,0,0,iw,topSrc,0,0,W,topH);
       ctx.drawImage(templateImg,0,midSrcY,iw,midSrcH,0,topH,W,H-topH-bottomH);
       ctx.drawImage(templateImg,0,ih-bottomSrc,iw,bottomSrc,0,H-bottomH,W,bottomH);
     }
   }
   const areaY=topH, areaH=H-topH-bottomH;
   const y0=areaY+(areaH-textH)/2;
   ctx.fillStyle="#ffffff";
   lines.forEach((line,li)=>{
     let x=areaX+(areaW-lineWidth(line,u))/2;
     const y=y0+li*lineStep;
     line.forEach(ch=>{
       const g=glyphs[ch];
       if(g){
         for(let r=0;r<GLYPH;r++){
           let c=0;
           while(c<GLYPH){
             if(!g[r*GLYPH+c]){c++;continue}
             const st=c;
             while(c<GLYPH&&g[r*GLYPH+c])c++;
             ctx.fillRect(x+st*u,y+r*u,(c-st)*u,u);
           }
         }
       }else if(ch!==" "&&ch!=="　") missing.add(ch);
       x+=GLYPH*u+GAP*u;
     });
   });
 }
 return missing;
}

 const tupa=$("#sampleTupa");
 ["tupaBounce","tupaHighJump","tupaDoubleJump","tupaShake","tupaSquish","tupaTilt","haloRush","tupaAngry"].forEach(c=>tupa.classList.remove(c));

const AFTER_ACTIONS=["tupaHighJump","tupaDoubleJump","tupaSquish","tupaTilt","haloRush"];
function challengeTupa(){
 if(rapidTaps.length>=6){ rapidTaps=[]; playTupaAction("tupaAngry"); return; }
 if(revealed){ playTupaAction(AFTER_ACTIONS[Math.floor(Math.random()*AFTER_ACTIONS.length)]); return; }
 const rest=closedSlots();
 if(rest.length) openSlot(rest[0]);
 if(rest.length<=1) finishAnswer(); else playTupaAction("tupaBounce");
}
function onTupa(){
 const now=Date.now();
 rapidTaps=rapidTaps.filter(t=>now-t<2000);
 rapidTaps.push(now);
 // お題を表示しているときは、文字を変えずに跳ねるだけ
 if(challengeText!==null){ challengeTupa(); return; }
 // 2秒以内に6回触ると、ちょっと怒る。
 if(!angryLock && rapidTaps.length>=6){
   angryLock=true; rapidTaps=[];
   $("#text").value="";
   setSample("さわりすぎ！"); lastSample="さわりすぎ！";
   playTupaAction("tupaAngry"); refresh();
   setTimeout(()=>{ angryLock=false; },1800);
   return;
 }
 if(angryLock) return;
 if($("#text").value){ playTupaAction("tupaBounce"); $("#text").value=""; refresh(); return; }
 if(specialCooldown>0) specialCooldown--;
 tapsUntilSpecial--;
 if(tapsUntilSpecial<=0 && specialCooldown===0){
   const r=TUPA_REACTIONS[Math.floor(Math.random()*TUPA_REACTIONS.length)];
   setSample(r.text); lastSample=r.text; playTupaAction(r.action);
   specialCooldown=2; tapsUntilSpecial=4+Math.floor(Math.random()*4);
   refresh(); return;
 }
 playTupaAction("tupaBounce");
 const pool=NORMAL_SAMPLES.slice(1).filter(s=>s!==lastSample);
 const next=pool[Math.floor(Math.random()*pool.length)];
 lastSample=next; setSample(next); refresh();
}

function blobOf(c){return new Promise(r=>c.toBlob(r,"image/png"))}
function download(blob,name){

// URL用:対応文字を1文字ずつ短い番号にして詰める。旧 #q=Base64 も読めます。
const URL_CHARS=Array.from(new Set([
 ..."あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん",
 ..."がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ",
 ..."0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ",
 ..."？！ー 　\n"
]));
function packed(s){
 const bytes=[];
 for(const ch of Array.from(s)){ const idx=URL_CHARS.indexOf(ch); if(idx<0)return null; bytes.push(idx); }
 let bin="";for(const b of bytes)bin+=String.fromCharCode(b);
 return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unpacked(s){
 try{
   s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
   const bin=atob(s);let out="";
   for(let i=0;i<bin.length;i++){const ch=URL_CHARS[bin.charCodeAt(i)];if(ch===undefined)return"";out+=ch}
   return out;
 }catch{return""}
}
function encoded(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function decoded(s){try{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)))}catch{return""}}
function shareUrlFor(raw){
 const u=new URL(location.href);u.search="";
 const p=packed(raw);
 u.hash=p!==null?"p="+p:"q="+encoded(raw);
 return u.toString();
}

     const file=new File([blob],"bibilu-moji.png",{type:"image/png"});
     if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
       await navigator.share({title:SHARE_TITLE,text:body,url,files:[file]}); return;
     }
   }
   if(!xFallback && navigator.share){ await navigator.share({title:SHARE_TITLE,text:body,url}); return; }
 }catch(e){ if(e.name==="AbortError") return; }
 if(xFallback){
   // 画像つき共有ができない環境:画像を保存して、Xの投稿画面を開く
   if(blob) download(blob,"bibilu-moji.png");

   return;

}

/* ---- ビビル文字のSVG(こたえ・もじひょう・管理者用) ---- */
function unionPath(g,x0,y0,u){
 const edges=[];
 const on=(r,c)=>r>=0&&r<7&&c>=0&&c<7&&g[r*7+c];
 const add=(x1,y1,x2,y2)=>edges.push([[x1,y1],[x2,y2]]);
 for(let r=0;r<7;r++)for(let c=0;c<7;c++)if(on(r,c)){
   const x=x0+c*u,y=y0+r*u;
   if(!on(r-1,c))add(x,y,x+u,y);
   if(!on(r,c+1))add(x+u,y,x+u,y+u);
   if(!on(r+1,c))add(x+u,y+u,x,y+u);
   if(!on(r,c-1))add(x,y+u,x,y);
 }
 const key=p=>p[0]+","+p[1], byStart=new Map();
 edges.forEach((e,i)=>{const k=key(e[0]);if(!byStart.has(k))byStart.set(k,[]);byStart.get(k).push(i)});
 const used=new Set();let d="";
 for(let i=0;i<edges.length;i++){
   if(used.has(i))continue;
   let e=edges[i];used.add(i);let cur=e[1];
   d+=`M${e[0][0]} ${e[0][1]}L${cur[0]} ${cur[1]}`;
   while(key(cur)!==key(e[0])){
     const candidates=byStart.get(key(cur))||[];
     const j=candidates.find(v=>!used.has(v));
     if(j===undefined)break;
     used.add(j);cur=edges[j][1];d+=`L${cur[0]} ${cur[1]}`;
   }
   d+="Z";
 }
 return d;
}
function glyphSvg(ch){
 const g=glyphs[ch];
 return `<svg viewBox="0 0 70 70" aria-hidden="true">${g?`<path d="${unionPath(g,0,0,10)}" fill="currentColor" fill-rule="evenodd"/>`:""}</svg>`;
}
function svgFor(text){
 const lines=linesFor(normalizeText(text||sampleText)),unit=10;
 const widest=Math.max(unit,...lines.map(line=>lineWidth(line,unit)));
 const h=Math.max(unit,lines.length*GLYPH*unit+Math.max(0,lines.length-1)*GAP*unit);
 let body="";
 lines.forEach((line,li)=>{
   let x=(widest-lineWidth(line,unit))/2;
   const y=li*(GLYPH+GAP)*unit;
   line.forEach(ch=>{ const g=glyphs[ch]; if(g)body+=`<path d="${unionPath(g,x,y,unit)}" fill="#000" fill-rule="evenodd"/>`; x+=charWidth(ch)*unit+GAP*unit; });
 });
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${widest} ${h}" width="${widest}" height="${h}">${body}</svg>`;
}
function svgForOneLine(text){
 const chars=[...normalizeText(text||sampleText).replace(/\n/g,"")];
 const unit=10, w=Math.max(unit,lineWidth(chars,unit)), h=GLYPH*unit;
 let body="",x=0;
 chars.forEach(ch=>{ const g=glyphs[ch]; if(g)body+=`<path d="${unionPath(g,x,0,unit)}" fill="#000" fill-rule="evenodd"/>`; x+=charWidth(ch)*unit+GAP*unit; });
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${body}</svg>`;
}
$("#saveSvg").onclick=()=>download(new Blob([svgFor($("#text").value||sampleText)],{type:"image/svg+xml"}),"ビビル文字_そのまま.svg");

// 五十音表の形(縦に あいうえお、横に あ行→ん)。空白は空きマス
const TABS=[
 {flow:"col",cols:["あいうえお","かきくけこ","さしすせそ","たちつてと","なにぬねの","はひふへほ","まみむめも","や ゆ よ","らりるれろ","わ   を","ん    "]},
 {flow:"col",cols:["がぎぐげご","ざじずぜぞ","だぢづでど","ばびぶべぼ","ぱぴぷぺぽ","     ","ー！？  "]},
 {flow:"row",rows:["0123456789","ABCDEFGHIJ","KLMNOPQRST","UVWXYZ    ","          "]}
];
const cell=ch=>ch===" "||!glyphs[ch]
 ?`<span class="k blank" aria-hidden="true">${glyphSvg(" ")}<i>　</i></span>`
 :`<button type="button" class="k" data-ch="${ch}" aria-label="${ch}">${glyphSvg(ch)}<i>${ch}</i></button>`;
function showTab(n){
 const t=TABS[n],g=$("#tabGrid");
 const lines=t.cols||t.rows;
 g.className="grid"+(t.flow==="col"?" col":"");
 g.style.setProperty("--cols",t.flow==="col"?lines.length:lines[0].length);
 g.innerHTML=lines.map(l=>[...l].map(cell).join("")).join("");
 document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab==n)));
}

// お題のヒント:使われている文字だけを、必ずバラバラの順番で
function showHint(text){
 const used=[...new Set(Array.from(text).filter(ch=>glyphs[ch]))];
 const mixed=used.slice();
 for(let tries=0;tries<20;tries++){
   for(let i=mixed.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [mixed[i],mixed[j]]=[mixed[j],mixed[i]]; }
   if(mixed.length<2||mixed.some((ch,i)=>ch!==used[i])) break;
 }
 $("#hintGrid").innerHTML=mixed.map(cell).join("");
}
function typeChar(ch){
 const ta=$("#text");
 if(ch==="\b"){ ta.value=Array.from(ta.value).slice(0,-1).join(""); }
 else if(Array.from(ta.value).length<120){ ta.value+=ch; }
 refresh();
}

let taps=0,timer,lastTouch=0;
