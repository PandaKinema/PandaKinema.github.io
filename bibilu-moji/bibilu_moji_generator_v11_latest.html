<title>ビビル文字ジェネレータ</title>
<style>
:root{--bg:#18140f;--paper:#efe1b9;--ink:#18140f;--panel:#fffaf0;--line:#cdbf98;--muted:#776b54}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink)}
.wrap{max-width:720px;margin:auto;padding:16px 12px 48px}
.hero{text-align:center;color:#fff7e5;padding:16px 0 18px}.hero h1{margin:0;font-size:27px;letter-spacing:.06em}.hero p{font-size:13px;opacity:.72;margin:7px 0 0}
.card{background:var(--panel);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 28px #0005}
label{font-size:13px;font-weight:800}

.previewWrap{margin-top:12px;padding:10px;background:#dfcea0;border-radius:14px;overflow:auto}

.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:11px 15px;font-weight:800;font-size:14px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink);flex:1}
button.secondary{flex:1}
.status,.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:9px}
.shareView{text-align:center}.shareView h2{font-size:18px;margin:2px 0 4px}.shareView .lead{font-size:13px;color:var(--muted);margin:0 0 10px}
.answer{margin-top:13px;padding:13px;background:#f4ead0;border-radius:12px;font-size:18px;font-weight:800;word-break:break-word}
.brand{font-weight:900;letter-spacing:.08em}
.hidden{display:none!important}
.admin{border-top:1px dashed var(--line);margin-top:15px;padding-top:13px}
@media(max-width:520px){.wrap{padding:10px 10px 36px}.card{padding:13px;border-radius:15px}.hero h1{font-size:23px}}
</style>

<div class="wrap">
<header class="hero"><h1 id="secretTitle">ビビル文字ジェネレータ</h1><p>ことばを、ビビル文字にしてみよう。</p></header>

<section id="maker">
 <div class="card">
  <label for="text">ことばをいれてね</label>
  <textarea id="text" maxlength="120">ビビルのとう</textarea>
  <div class="note">ひらがな・カタカナ・英字・数字・一部の記号に対応しています。英字は大文字・小文字どちらでも同じ文字として変換されます。小さい「ゃ・ゅ・ょ・っ」などは大きい文字に置きかわります。未対応の文字は空白になります。</div>
 </div>
 <div class="card">
  
  <div class="previewWrap"><canvas id="preview"></canvas></div>
  <div id="missing" class="status"></div>
  <div class="row">
   <button id="savePng" class="primary">もじをほぞん</button>
   <button id="sharePage" class="secondary">もじをおくる</button><button id="shareXMaker" class="secondary">Xでシェア</button>
  </div>
  <div class="note">画像には『ビビルの塔』と ©2026 PANDA KINEMA が入ります。</div>
  <div id="admin" class="admin hidden">
   <div class="note">管理者モード</div>
   <div class="row"><button id="saveSvg">SVGでほぞん</button><button id="resetData">初期データに戻す</button></div>
   <div class="row"><input id="jsonFile" type="file" accept=".json,application/json"></div>
  </div>
 </div>
</section>

 </div>
</section>

function unionPath(g,x0,y0,u){

   const x=x0+c*u,y=y0+r*u;
   if(!on(r-1,c))add(x,y,x+u,y);
   if(!on(r,c+1))add(x+u,y,x+u,y+u);
   if(!on(r+1,c))add(x+u,y+u,x,y+u);
   if(!on(r,c-1))add(x,y+u,x,y);

}
function svgFor(text){
 const lines=linesFor(text),unit=10,pad=20;
 const widest=Math.max(unit,...lines.map(line=>lineWidth(line,unit)));
 const w=pad*2+widest;
 const h=pad*2+lines.length*GLYPH*unit+Math.max(0,lines.length-1)*GAP*unit;
 let body="";
 lines.forEach((line,li)=>{
   let x=(w-lineWidth(line,unit))/2,y=pad+li*(GLYPH+GAP)*unit;
   line.forEach(ch=>{
     const g=glyphs[ch];
     if(g)body+=`<path d="${unionPath(g,x,y,unit)}" fill="#000" fill-rule="evenodd"/>`;
     x+=charWidth(ch)*unit+GAP*unit;
   });
 });
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${body}</svg>`;
}
$("#saveSvg").onclick=()=>{
 const blob=new Blob([svgFor($("#text").value)],{type:"image/svg+xml"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="ビビル文字.svg";document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
};
let taps=0,timer;$("#secretTitle").onclick=()=>{taps++;clearTimeout(timer);timer=setTimeout(()=>taps=0,1300);if(taps>=5){$("#admin").classList.toggle("hidden");taps=0}};
const hash=new URLSearchParams(location.hash.slice(1)),q=hash.get("q");
if(q){const t=decoded(q);if(t)showChallenge(t);else refresh()}else refresh();
</script>
