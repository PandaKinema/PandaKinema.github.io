# Pages CMS(https://app.pagescms.org)の編集画面の設定
# 保存すると GitHub Actions が new/index.html を自動で作り直します(1〜2分)
media:
  input: new/img
  output: img
  categories: [image, video]

content:
  - name: news
    label: ニュース
    type: file
    path: content/news.yml
    format: yaml
    list: true
    fields:
      - { name: date, label: 日付, type: date, required: true, description: "カレンダーから選ぶ。サイトには 2026.10.18 の形で出ます(上にあるものから順に表示)" }
      - { name: cat_ja, label: カテゴリ(日本語), type: string, description: "例:お知らせ / 新作 / 出展" }
      - { name: cat_en, label: カテゴリ(英語), type: string, description: "例:News / New / Event" }
      - { name: text_ja, label: タイトル(日本語), type: string, required: true, description: "一覧とポップアップに出る1行" }
      - { name: text_en, label: タイトル(英語), type: string, description: "空なら日本語をそのまま表示" }
      - { name: body_ja, label: 内容(日本語), type: text, description: "タイトルを押すと出るポップアップの本文。改行もそのまま反映されます" }
      - { name: body_en, label: 内容(英語), type: text }
      - { name: link, label: リンク先, type: string, description: "ポップアップの下に「リンクを開く」ボタンが出ます。URL、または games/bibilu/ のようなサイト内のページ。空ならボタンなし" }

  - name: videos
    label: 動画(MOVIE)
    type: file
    path: content/videos.yml
    format: yaml
    list: true
    fields:
      - { name: title, label: 作品名, type: string, required: true }
      - { name: kind_ja, label: 種類(日本語), type: string, description: "例:遊び方動画 / 予告編" }
      - { name: kind_en, label: 種類(英語), type: string, description: "例:How to play / Trailer" }
      - { name: poster, label: サムネイル, type: image, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。16:9 の画像" }
      - { name: youtube, label: YouTube の動画ID, type: string, description: "YouTubeのURL(またはID)。空なら「準備中」" }

  - name: banners
    label: バナーの順番
    type: file
    path: content/banners.yml
    format: yaml
    list: true
    fields:
      - { name: key, label: 作品の key, type: string, description: "作品やツールのバナーを出すとき:ボードゲーム・ミニシアター・ツールの key(trico, bibilu, koikoi, moji, mockmaker など)" }
      - { name: youtube, label: 背景で流すYouTube, type: string, description: "YouTubeのURL。key と一緒に入れると、ロゴやボタンはそのままで背景に音なしで流れます" }
      - { name: video, label: 背景で流す動画(mp4), type: file, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。mp4 の動画。key と一緒に入れると背景で流れます(YouTubeより優先)。10MB以下くらいに" }
      - { name: image, label: バナー画像(自分で作ったもの), type: image, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。key を空にして、画像だけのバナーを出すとき。画面いっぱいに広がるので、大事なものは中央に。横1920px以上" }
      - { name: link, label: バナー画像のリンク先, type: string, description: "押したときに開くURL。空ならリンクなし" }
      - { name: bg, label: 読み込み中の色, type: string, description: "画像や動画が出るまでの背景色。例:#173f54。空なら黒" }
      - { name: alt, label: バナー画像の説明, type: string, description: "画像に書いてある内容を短く(読み上げ用)" }

  - name: games
    label: ボードゲーム(カード)
    description: "BOARD GAME の列に並ぶ作品。ミニシアターもここ。並び順はドラッグで変えられます"
    type: file
    path: content/games.yml
    format: yaml
    list: true
    fields:
      - { name: key, label: key(英小文字), type: string, required: true, description: "バナーの順番で使う名前。あとから変えない" }
      - { name: name, label: 作品名, type: string, required: true }
      - { name: series, label: シリーズ名, type: string, description: "例:MINI THEATER SERIES 01。バナーのロゴの上に出ます。空でOK" }
      - { name: new, label: 新作マークを付ける, type: boolean, description: "オンにすると、カードの下の中央とバナーに「新作」が出ます" }
      - { name: front, label: 閉じたカードの画像, type: image, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。縦長 840×1185(比率 約1:1.41)で作った画像をそのまま使います" }
      - { name: pkg, label: パッケージ, type: image, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。開いたカードとバナーに出ます。背景が透明なPNG/WebP。横長の画像は横長の置き方になります" }
      - { name: logo, label: ロゴ, type: image, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。背景が透明なPNG" }
      - { name: key1, label: キーカラー1, type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "#664498 のような6けたの色コードで" }, description: "作品の色その1(例:パッケージの帯の色)。ほかの色の欄はここから選びます。色見本 → https://pandakinema.github.io/new/colors.html" }
      - { name: key2, label: キーカラー2, type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "#664498 のような6けたの色コードで" }, description: "作品の色その2(例:パッケージの面の色)。色見本 → https://pandakinema.github.io/new/colors.html" }
      - { name: extra_color, label: その他の色(必要なときだけ), type: string, pattern: { regex: "^(#[0-9a-fA-F]{6})?$", message: "#fef4d6 のような6けたの色コードで" }, description: "キーカラー2色と白・黒以外の色を使いたいときだけ。各欄で「その他の色」を選ぶと使われます" }
      - { name: card_bg, label: 開いたカードの背景, type: select, default: key2, options: { values: [ { value: key1, label: "キーカラー1" }, { value: key2, label: "キーカラー2" }, { value: extra, label: "その他の色" }, { value: white, label: "白" }, { value: black, label: "黒" } ] }, description: "ふつうはキーカラー2" }
      - { name: pill_bg, label: 人数〜年齢の下地, type: select, default: key1, options: { values: [ { value: key1, label: "キーカラー1" }, { value: key2, label: "キーカラー2" }, { value: extra, label: "その他の色" }, { value: white, label: "白" }, { value: black, label: "黒" } ] }, description: "ジャンルの文字もこの色。ふつうはキーカラー1" }
      - { name: pill_text, label: 人数〜年齢の文字, type: select, default: key2, options: { values: [ { value: key1, label: "キーカラー1" }, { value: key2, label: "キーカラー2" }, { value: extra, label: "その他の色" }, { value: white, label: "白" }, { value: black, label: "黒" } ] }, description: "ふつうはキーカラー2" }
      - { name: logo_color, label: カードのロゴの色, type: select, default: key1, options: { values: [ { value: key1, label: "キーカラー1" }, { value: key2, label: "キーカラー2" }, { value: extra, label: "その他の色" }, { value: white, label: "白" }, { value: black, label: "黒" }, { value: original, label: "ロゴ画像の色のまま" } ] }, description: "ロゴが単色なら塗る色、多色なら「ロゴ画像の色のまま」" }
      - { name: players, label: 人数, type: string, description: "例:2〜4" }
      - { name: time, label: 時間(分), type: string, description: "例:10〜15" }
      - { name: age, label: 対象年齢, type: string, description: "例:6" }
      - { name: genre_ja, label: ジャンル(日本語), type: string }
      - { name: genre_en, label: ジャンル(英語), type: string }
      - { name: intro_ja, label: 紹介文(日本語), type: text, description: "トップのバナーに出る短い紹介。1〜2文" }
      - { name: intro_en, label: 紹介文(英語), type: text, description: "空なら日本語をそのまま表示" }
      - { name: page, label: 「詳しく見る」のリンク先, type: string, description: "URL、または games/bibilu/ のようなサイト内のページ" }
      - { name: booth, label: 「BOOTHで購入」のリンク先, type: string, description: "作品のBOOTHページ。空ならサークルのBOOTHトップ" }
      - name: banner
        label: バナー
        type: object
        fields:
          - { name: bg, label: 背景, type: select, default: key2, options: { values: [ { value: key1, label: "キーカラー1" }, { value: key2, label: "キーカラー2" }, { value: extra, label: "その他の色" }, { value: white, label: "白" }, { value: black, label: "黒" } ] }, description: "" }
          - { name: pattern, label: 背景の模様, type: select, options: { values: [ { value: none, label: "なし" }, { value: tri, label: "トリコの三角" } ] } }
          - { name: image, label: 背景画像, type: image, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。入れるとパッケージの代わりにこの画像を背景にします。横1920px以上、文字なし。左側に文字とボタンが重なります" }
          - { name: logo_color, label: ロゴの色, type: select, default: key1, options: { values: [ { value: key1, label: "キーカラー1" }, { value: key2, label: "キーカラー2" }, { value: extra, label: "その他の色" }, { value: white, label: "白" }, { value: black, label: "黒" }, { value: original, label: "ロゴ画像の色のまま" } ] }, description: "" }
          - { name: text_color, label: 文字の色, type: select, default: white, options: { values: [ { value: key1, label: "キーカラー1" }, { value: key2, label: "キーカラー2" }, { value: extra, label: "その他の色" }, { value: white, label: "白" }, { value: black, label: "黒" } ] }, description: "人数〜ジャンルと紹介文の色" }
          - { name: video, label: 動画, type: file, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。背景で流す動画(mp4・音なしでくり返し)。入れるとパッケージの代わりに流れます。10MB以下くらいに" }
          - { name: youtube, label: YouTube(動画), type: string, description: "YouTubeのURLかID。音なしでくり返し流れます。mp4 の動画があればそちらが優先" }

  - name: tools
    label: ツール(PLAY&TOOLS)
    type: file
    path: content/tools.yml
    format: yaml
    list: true
    fields:
      - { name: key, label: key(英小文字), type: string, required: true, description: "バナーの順番で使う名前" }
      - { name: name, label: ツール名, type: string, required: true }
      - { name: url, label: ツールのURL, type: string, required: true }
      - { name: title_image, label: タイトル画像, type: image, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。ロゴ画像があれば。空ならツール名を文字で出す" }
      - { name: image, label: バナーの絵(画面写真など), type: image, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK" }
      - { name: thumb, label: 一覧の絵(正方形), type: image, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。PLAY&TOOLS の一覧に出る絵。空ならバナーの絵" }
      - { name: intro_ja, label: 紹介文(日本語), type: text }
      - { name: intro_en, label: 紹介文(英語), type: text }
      - { name: button_ja, label: ボタンの文字(日本語), type: string, description: "例:あそぶ / つかう" }
      - { name: button_en, label: ボタンの文字(英語), type: string, description: "例:Play / Open" }
      - { name: bg, label: 背景色, type: string }
      - { name: text_color, label: 文字の色, type: string }
      - { name: video, label: バナーの動画, type: file, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。mp4・音なし。10MB以下くらいに" }
      - { name: youtube, label: YouTube(動画), type: string, description: "YouTubeのURLかID。音なしでくり返し流れます。mp4 の動画があればそちらが優先" }

  - name: site
    label: サイト全体
    type: file
    path: content/site.yml
    format: yaml
    fields:
      - { name: slide_seconds, label: バナーが切り替わる秒数, type: number }
      - { name: booth, label: BOOTH のURL, type: string }
      - { name: x, label: パンダキネマの X, type: string }
      - { name: gamemarket, label: ゲームマーケットのURL, type: string }
      - { name: note, label: note のURL, type: string }
      - { name: member_x, label: ゐするぎの X, type: string }
      - { name: mail, label: 連絡先メール, type: string }
      - { name: ogp_image, label: X共有画像(トップ), type: image, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。1200×630" }
      - { name: header_logo, label: ヘッダーのロゴ, type: image, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。白い文字のロゴ(背景透明)。高さ24pxで表示" }
      - { name: about_logo, label: ABOUT のロゴ, type: image, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。白いロゴ(背景透明)" }
      - { name: icon, label: アイコン, type: image, description: "【差し替え】画像の右下のゴミ箱で外すと「Upload」が出ます。新しい画像をここへドラッグしてもOK。MEMBER の丸の中に出るマーク(背景透明・単色)" }
      - { name: about_ja, label: ABOUT の文(日本語), type: text }
      - { name: about_en, label: ABOUT の文(英語), type: text }
